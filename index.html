    }
    var byRoot = {}, clusters = [], of = [];
    for (i = 0; i < n; i++) {
      var r = find(i), c = byRoot[r];
      if (!c) { c = byRoot[r] = { vars: [], members: [], spread: 0 }; clusters.push(c); }
      c.vars.forEach(function (k) { if (V.M[i][k].diffs > c.spread) c.spread = V.M[i][k].diffs; });
      c.vars.push(i);
      c.members = c.members.concat(V.groups[i].members);
      of[i] = clusters.indexOf(c);
    }
    return (clusterCache[t] = { clusters: clusters, of: of });
  }
  // Closest pair of variants between two clusters (identity with the highest %).
  function clusterDist(a, b) {
    var M = allVariants().M, best = null;
    a.vars.forEach(function (i) {
      b.vars.forEach(function (j) { if (!best || M[i][j].pct > best.pct) best = M[i][j]; });
    });
    return best;
  }

  function variantTreeLink(rec, text) {
    return rec["COI"] ? '<a class="tree-link" href="' + variantTreeHash(rec) + '">' + (text || "Individträd →") + "</a>" : "";
  }

  // Label bits for a cluster: a collection number (+ others, spread) and species.
  function clusterInfo(c, first) {
    first = first || c.members[0];
    var sp = {};
    c.members.forEach(function (r) { sp[r.__species] = 1; });
    sp = Object.keys(sp);
    var extra = [];
    if (c.members.length > 1) extra.push("+" + (c.members.length - 1));
    return {
      sn: (first["Samlings-nummer"] || first["ID"] || "—") + (extra.length ? " (" + extra.join(", ") + ")" : ""),
      species: sp,
      spLabel: sp.length === 1 ? shortName(sp[0]) : sp.length + " arter"
    };
  }

  function renderVariantTree(rec, count, t) {
    var V = allVariants(), vi = V.of[rec.__slug];
    if (vi === undefined) {
      view.innerHTML = '<a class="back" href="#/i/' + encodeURIComponent(rec.__slug) + '">&larr; Till individen</a>' +
        '<div class="card"><p class="empty">Individen saknar COI, så inget träd kan visas.</p></div>';
      return;
    }
    var C = variantClusters(t), base = C.clusters[C.of[vi]];
    var near = C.clusters.filter(function (c) { return c !== base; })
      .map(function (c) { return { c: c, id: clusterDist(base, c) }; })
      .sort(function (a, b) { return b.id.pct - a.id.pct; })
      .slice(0, count);
    var cs = [base].concat(near.map(function (x) { return x.c; }));
    var baseSp = rec.__species;
    function colorOf(info) {
      if (info.species.length > 1) return MIXED_COLOR;
      return info.species[0] === baseSp ? SPECIES_COLORS[0] : SPECIES_COLORS[1];
    }
    function bar(label, opts, cur, href) {
      return '<div class="sort-bar"><span class="lbl">' + label + "</span>" + opts.map(function (o) {
        return '<a class="sort-btn' + (o === cur ? " on" : "") + '" href="' + href(o) + '">' + o + "</a>";
      }).join("") + "</div>";
    }
    var controls =
      bar("Antal noder:", VTREE_COUNTS, count, function (o) { return variantTreeHash(rec, o, t); }) +
      bar("Gruppera vid ≤ skillnader (bp):", VTREE_THRESHOLDS, t, function (o) { return variantTreeHash(rec, count, o); });

    var rows = near.map(function (x, k) {
      var info = clusterInfo(x.c), sns = x.c.members.map(function (r) { return r["Samlings-nummer"] || r["ID"]; });
      return '<li data-k="' + (k + 1) + '">' +
        '<span class="li-main"><span class="sci">' + esc(info.species.join(", ")) + "</span>" +
          '<span class="common">' + esc(sns.slice(0, 6).join(", ") + (sns.length > 6 ? " +" + (sns.length - 6) : "")) +
            (x.c.spread ? " · inbördes ≤" + x.c.spread + " bp" : "") + "</span></span>" +
        '<span class="li-meta"><strong>' + fmtPct(100 - x.id.pct) + "</strong> · " + diffLabel(x.id.diffs) +
          '<a href="#/i/' + encodeURIComponent(x.c.members[0].__slug) + '">individ →</a></span>' +
      "</li>";
    }).join("");

    view.innerHTML =
      '<a class="back" href="#/i/' + encodeURIComponent(rec.__slug) + '">&larr; Till individen</a>' +
      '<div class="card">' +
        "<h2>Individträd: " + esc(rec["Samlings-nummer"] || rec["ID"] || "—") +
          (rec.__taxon ? " (<i>" + esc(rec.__taxon) + "</i>)" : "") + "</h2>" +
        '<div class="subtitle">' + esc([rec["Provins"], rec["Lokalnamn"], rec["Startdatum"]].filter(Boolean).join(" · ")) + "</div>" +
        '<div class="subtitle">' +
          [rec.__taxon === baseSp ? "" : "<i>" + esc(baseSp) + "</i>", // only when it differs from Släkte/art
           base.members.length > 1 ? base.members.length + " individer i samma nod" : "",
           near.length + " närmaste noder"].filter(Boolean).join(" · ") + "</div>" +
        controls +
        '<div class="chart-note">Neighbour joining på unika COI-varianter, rotat i basindividen (N ignoreras). ' +
          (t ? "Varianter som via en kedja ligger inom " + t + " bp från varandra slås ihop till en nod; " +
               "avstånd mellan noder = närmaste paret. "
             : "Identisk COI = en nod. ") +
          "Procent efter namnet = skillnad mot basen; (+n) = fler individer i noden. " +
          '<span class="sw-dot" style="background:' + SPECIES_COLORS[0] + '"></span><i>' + esc(baseSp) + "</i> " +
          '<span class="sw-dot" style="background:' + SPECIES_COLORS[1] + '; margin-left: 8px"></span>andra arter ' +
          '<span class="sw-dot" style="background:' + MIXED_COLOR + '; margin-left: 8px"></span>flera arter i noden. ' +
          "Klicka på en nod för att utgå från den.</div>" +
        '<div class="tree sptree" id="vtree"></div>' +
        '<div class="seq-header"><h3>Noder i trädet</h3></div>' +
        '<ul class="list species-rows sptree-rows">' + rows + "</ul>" +
      "</div>";

    var n = cs.length, D = [], i, j;
    for (i = 0; i < n; i++) {
      D[i] = [];
      for (j = 0; j < n; j++) D[i][j] = i === j ? 0 : 100 - clusterDist(cs[i], cs[j]).pct;
    }
    function pick(k) { setHash(variantTreeHash(cs[k].members[0], count, t).slice(1)); }
    drawRootedTree("vtree", D, cs.map(function (c, k) {
      var info = clusterInfo(c, k ? null : rec);
      return {
        pre: info.sn,
        name: info.spLabel,
        dist: k ? fmtPct(100 - near[k - 1].id.pct) : "",
        title: info.species.join(", ") + " – " + c.members.map(function (r) { return r["Samlings-nummer"] || r["ID"]; }).join(", ") +
          (k ? " – klicka för att utgå från denna nod" : ""),
        color: colorOf(info)
      };
    }), "Individträd från " + (rec["Samlings-nummer"] || rec["ID"]), pick);
    Array.prototype.forEach.call(view.querySelectorAll(".sptree-rows li"), function (li) {
      li.addEventListener("click", function (e) {
        if (e.target.closest("a")) return; // "individ →" link
        pick(+li.getAttribute("data-k"));
      });
    });
    window.scrollTo(0, 0);
  }

  // --- Reference page (#/r/<slug>[/<art|land|bin>]) ---
  // One individual plotted among its closest BOLD reference sequences (ref/<hash>.js,
  // built by scripts/build_reference.py). Distances are precomputed (tenths of a %),
  // so the page only runs the MDS. Reference points are colored by country, species
  // name or BIN; a point that several records share is colored by its commonest value.
  var REF_MODES = [
    { key: "art", label: "Art", field: "species", what: "art" },
    { key: "land", label: "Land", field: "countries", what: "land" },
    { key: "bin", label: "BIN", field: "bins", what: "BIN" }
  ];
  var REF_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#8e5bd1", "#d6a21e", "#d4457a", "#3fa7c9", "#7a8a2b"];
  var REF_OTHER = "#9a9aa5", REF_NONE = "#d3d3da", REF_OTHER_KEY = "__other";
  var refPin = null; // legend group kept lifted after a tap
  var refSel = null, refListShown = 12; // selected group (id of its nearest record), rows shown in the list
  var refHideSuspicious = false, refToken = 0;
  var REF_AUTO_GROUPS = 5; // the automatic difference limit shows about this many groups
  var refState = { maxDiff: null }; // maxDiff null = automatic
  var REF_GROUP_MAX = 10, REF_GROUP_DEFAULT = 2, refGroupBp = REF_GROUP_DEFAULT; // merge sequences within ≤ n bp of each other (0 = off)

  function refMode(key) {
    return REF_MODES.filter(function (m) { return m.key === key; })[0] || REF_MODES[0];
  }
  function refHash(rec, mode) { // without settings; those are added by refQuery()
    return "#/r/" + encodeURIComponent(rec.__slug) + (mode && mode !== REF_MODES[0].key ? "/" + mode : "");
  }
  function hasRef(rec) { return !!(window.DNA_REF_INDEX && window.DNA_REF_INDEX[rec.__slug]); }
  function refLink(rec) {
    return hasRef(rec) ? ' · <a class="species-link" href="' + refHash(rec) + '">Visa referensdata →</a>' : "";
  }

  // Load a reference file (a plain script, so it also works from file://); it fills window[store][hash].
  function loadRef(target, cb) {
    if (!target) return cb(null);
    var store = window[target.store] = window[target.store] || {}, h = target.hash;
    if (store[h]) return cb(store[h]);
    var s = document.createElement("script");
    s.src = target.src;
    s.onload = function () { cb(store[h] || null); };
    s.onerror = function () { cb(null); };
    document.head.appendChild(s);
  }

  // What the page needs to know about what it shows: an individual (#/r/) or a species (#/sr/).
  function refCtxInd(rec) {
    var h = window.DNA_REF_INDEX && window.DNA_REF_INDEX[rec.__slug];
    return {
      target: h ? { src: "ref/" + h + ".js", store: "DNA_REF", hash: h } : null,
      hash: function (mode) { return refHash(rec, mode); },
      back: "#/i/" + encodeURIComponent(rec.__slug), backText: "Till individen", what: "individen",
      name: rec["Vetenskapligt namn"] || "—",
      sub: function (ref) {
        return esc(rec["Samlings-nummer"] || rec["ID"] || "") + " · närmaste COI-sekvenser ur BOLD (" + ref.reference_sequences + " unika)";
      },
      note: "◇ = den här individen (ihålig, så punkter under syns)", ownTip: false
    };
  }
  function speciesRefHash(sp, mode) {
    return "#/sr/" + encodeURIComponent(sp.slug) + (mode && mode !== REF_MODES[0].key ? "/" + mode : "");
  }
  function hasSpeciesRef(sp) { return !!(window.DNA_REF_SPECIES && window.DNA_REF_SPECIES[sp.name]); }
  function refCtxSp(sp) {
    var info = window.DNA_REF_SPECIES && window.DNA_REF_SPECIES[sp.name];
    return {
      target: info ? { src: "ref/sp_" + info.file + ".js", store: "DNA_REF_SP", hash: info.file } : null,
      hash: function (mode) { return speciesRefHash(sp, mode); },
      back: "#/s/" + encodeURIComponent(sp.slug), backText: "Till artsidan", what: "artens varianter",
      name: sp.name,
      sub: function (ref) {
        return ref.own.length + (ref.own.length === 1 ? " egen COI-variant" : " egna COI-varianter") + " · " + ref.k +
          " referenssekvenser ur BOLD (artens BIN:ar först, sedan de närmaste)";
      },
      note: "◇ = artens egna COI-varianter (ihåliga, så punkter under syns; hovra för individerna)", ownTip: true
    };
  }
  function refOwnCount(ref) { return ref.own ? ref.own.length : 1; }

  // Value with the highest record count; named values win over the empty (unknown) one.
  function refMajor(counts) {
    var best = null, bestN = 0, anyUnknown = false;
    Object.keys(counts).forEach(function (k) {
      if (k === "") { anyUnknown = true; return; }
      if (counts[k] > bestN) { best = k; bestN = counts[k]; }
    });
    return best !== null ? best : (anyUnknown ? "" : null);
  }
  function refTop(counts, max) {
    var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var txt = keys.slice(0, max).map(function (k) { return (k === "" ? "okänd" : esc(k)) + " ×" + counts[k]; }).join(", ");
    return txt + (keys.length > max ? " +" + (keys.length - max) : "");
  }

  function refSumCounts(list, field) {
    var out = {};
    list.forEach(function (nb) { Object.keys(nb[field]).forEach(function (k) { out[k] = (out[k] || 0) + nb[field][k]; }); });
    return out;
  }

  // Single-linkage clusters over the own points (rows 0..ownCount-1) and the neighbours: two
  // sequences share a cluster when a chain of sequences, each ≤ bp differences (~tenths of %
  // over 658 bp) from the next, joins them. So a reference sequence that grouping makes equal
  // to an own point ends up in that point's cluster, at the same place in the plot.
  // Returns [{ rows, own: own indices, nb: merged neighbour or null }], own points first.
  function refCluster(ref, nbs, rows, bp, ownCount) {
    var total = ownCount + nbs.length, par = [], i, j;
    function rowOf(x) { return x < ownCount ? x : rows[x - ownCount]; }
    function find(x) { while (par[x] !== x) x = par[x] = par[par[x]]; return x; }
    for (i = 0; i < total; i++) par[i] = i;
    var cut = (bp + 0.5) * 1000 / 658;
    if (bp) {
      for (i = 0; i < total; i++) for (j = i + 1; j < total; j++) {
        if (ref.dist[rowOf(i)][rowOf(j)] <= cut) par[find(i)] = find(j);
      }
    }
    var byRoot = {}, out = [];
    for (i = 0; i < total; i++) {
      var r = find(i), c = byRoot[r];
      if (!c) { c = byRoot[r] = { members: [], mrows: [], rows: [], own: [] }; out.push(c); }
      c.rows.push(rowOf(i));
      if (i < ownCount) c.own.push(i);
      else { c.members.push(nbs[i - ownCount]); c.mrows.push(rows[i - ownCount]); }
    }
    return out.map(function (c) {
      var m = c.members, spread = 0, a, b;
      for (a = 0; a < c.mrows.length; a++) for (b = a + 1; b < c.mrows.length; b++) {
        spread = Math.max(spread, ref.dist[c.mrows[a]][c.mrows[b]]);
      }
      return {
        rows: c.rows, own: c.own,
        nb: !m.length ? null : {
          identity: m[0].identity, variants: m.length, spread: spread,
          n: m.reduce(function (t, x) { return t + x.n; }, 0),
          ids: [].concat.apply([], m.map(function (x) { return x.ids; })).slice(0, 5),
          species: refSumCounts(m, "species"), bins: refSumCounts(m, "bins"),
          countries: refSumCounts(m, "countries"),
          suspicious: m.reduce(function (t, x) { return t + x.suspicious; }, 0)
        }
      };
    });
  }

  // Filter settings live in the hash query (#/r/<slug>/<mode>?d=3.31&g=2&s=1) so they survive
  // a reload and can be shared: d = max % difference (absent = automatic), g = group at ≤ g bp
  // (absent = default), s = 1 hides suspicious.
  function refParseQuery(q) {
    var o = {};
    (q || "").split("&").forEach(function (p) {
      var kv = p.split("=");
      if (kv[0]) o[kv[0]] = decodeURIComponent(kv[1] || "");
    });
    return o;
  }
  function refQuery() {
    var parts = [];
    if (refState.maxDiff !== null) parts.push("d=" + refState.maxDiff.toFixed(2));
    if (refGroupBp !== REF_GROUP_DEFAULT) parts.push("g=" + refGroupBp);
    if (refHideSuspicious) parts.push("s=1");
    return parts.length ? "?" + parts.join("&") : "";
  }

  function renderRef(rec, modeKey, query) { startRef(refCtxInd(rec), modeKey, query); }
  function renderSpeciesRef(sp, modeKey, query) { startRef(refCtxSp(sp), modeKey, query); }

  function startRef(ctx, modeKey, query) {
    var token = ++refToken, mode = refMode(modeKey), q = refParseQuery(query);
    refPin = null; refSel = null; refListShown = 12;
    refState.maxDiff = q.d !== undefined && q.d !== "" && isFinite(+q.d) ? Math.max(0, +q.d) : null;
    var g = q.g === undefined || q.g === "" ? NaN : Math.round(+q.g);
    refGroupBp = g >= 0 && g <= REF_GROUP_MAX ? g : REF_GROUP_DEFAULT;
    refHideSuspicious = q.s === "1";
    view.innerHTML = '<a class="back" href="' + ctx.back + '">&larr; ' + ctx.backText + '</a>' +
      '<div class="card"><p class="empty">Läser in referensdata…</p></div>';
    loadRef(ctx.target, function (ref) {
      if (token !== refToken) return; // navigated away meanwhile
      if (!ref) {
        view.querySelector(".card").innerHTML = '<p class="empty">Ingen referensdata hittades.</p>';
        return;
      }
      buildRef(ctx, ref, mode);
    });
  }

  // Color slot per value (species / country / BIN), in order of first appearance among all the
  // neighbours, nearest first, so the nearest relatives get the first colors whatever the filters.
  function refColorRank(ref, mode) {
    var cache = ref.__rank = ref.__rank || {};
    if (cache[mode.key]) return cache[mode.key];
    var rank = {}, next = 0;
    ref.neighbours.forEach(function (nb) {
      var c = nb[mode.field];
      Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).forEach(function (k) {
        if (k !== "" && !(k in rank)) rank[k] = next++;
      });
    });
    return (cache[mode.key] = rank);
  }

  function refDiffOf(nb) { return Math.round((100 - nb.identity) * 100) / 100; } // % difference, 2 decimals

  // Neighbours not hidden as suspicious; rows[i] is nbs[i]'s row in ref.dist (the own points come first).
  function refVisible(ref) {
    var nbs = [], rows = [], own = refOwnCount(ref);
    ref.neighbours.forEach(function (nb, i) {
      if (refHideSuspicious && nb.suspicious >= nb.n) return;
      nbs.push(nb); rows.push(i + own);
    });
    return { nbs: nbs, rows: rows };
  }

  // Smallest difference limit that shows at least REF_AUTO_GROUPS groups (all, if there are fewer).
  function refAutoDiff(ref, vis) {
    var n = vis.nbs.length, m;
    for (m = 1; m <= n; m++) {
      var groups = refCluster(ref, vis.nbs.slice(0, m), vis.rows.slice(0, m), refGroupBp, refOwnCount(ref));
      if (groups.filter(function (c) { return c.nb; }).length >= REF_AUTO_GROUPS) {
        return refDiffOf(vis.nbs[m - 1]);
      }
    }
    return n ? refDiffOf(vis.nbs[n - 1]) : 0;
  }

  // The page shell. The sliders sit below the plot, whose height is fixed, so they stay
  // under the finger while dragging; everything that depends on them is filled by updateRef.
  function buildRef(ctx, ref, mode) {
    var anySuspicious = ref.neighbours.some(function (nb) { return nb.suspicious > 0; });
    var sliderMax = Math.ceil(Math.max.apply(null, ref.neighbours.map(refDiffOf)) * 10) / 10;

    var buttons = '<div class="sort-bar"><span class="lbl">Färga efter:</span>' + REF_MODES.map(function (m) {
      return '<a class="sort-btn" data-mode="' + m.key + '" href="#">' + m.label + "</a>";
    }).join("") + (anySuspicious ? '<button class="sort-btn" id="ref-susp">Dölj misstänkta</button>' : "") + "</div>";

    view.innerHTML =
      '<a class="back" href="' + ctx.back + '">&larr; ' + ctx.backText + '</a>' +
      '<div class="card">' +
        "<h2>Referensdata: <i>" + esc(ctx.name) + "</i></h2>" +
        '<div class="subtitle">' + ctx.sub(ref) + "</div>" +
        buttons +
        '<div class="chart-note">Avstånd i bilden ≈ skillnad i COI (%). ' + ctx.note + '; punktstorlek = antal BOLD-poster med samma sekvens. ' +
          "Klicka på en punkt eller en rad i listan för att markera den; länk till BOLD finns i listan.</div>" +
        '<div class="plot-wrap"><div id="plot"></div><div class="tip" id="tip" hidden></div></div>' +
        '<div class="ctl"><span class="lbl">Max skillnad</span>' +
          '<input type="range" id="ref-diff" min="0" max="' + sliderMax + '" step="0.01">' +
          '<span class="ctl-val" id="ref-diff-val"></span></div>' +
        '<div class="ctl"><span class="lbl">Gruppera lika</span>' +
          '<input type="range" id="ref-group" min="0" max="' + REF_GROUP_MAX + '" step="1">' +
          '<span class="ctl-val" id="ref-group-val"></span></div>' +
        '<div class="ctl-note" id="ref-status"></div>' +
        '<div class="legend-sp" id="ref-legend"></div>' +
        '<div class="seq-header"><h3>Närmaste sekvenserna</h3></div>' +
        '<ul class="list species-rows refrows" id="ref-list"></ul>' +
        '<div id="ref-more"></div>' +
      "</div>";

    var pending = false;
    function update() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; updateRef(ctx, ref, mode, sliderMax); });
    }
    document.getElementById("ref-diff").addEventListener("input", function () {
      refState.maxDiff = +this.value;
      update();
    });
    document.getElementById("ref-group").addEventListener("input", function () {
      refGroupBp = +this.value;
      update();
    });
    var sb = document.getElementById("ref-susp");
    if (sb) sb.addEventListener("click", function () { refHideSuspicious = !refHideSuspicious; update(); });

    updateRef(ctx, ref, mode, sliderMax);
    window.scrollTo(0, 0);
  }

  function updateRef(ctx, ref, mode, sliderMax) {
    var ownCount = refOwnCount(ref);
    var vis = refVisible(ref);
    var auto = refState.maxDiff === null;
    var maxD = auto ? refAutoDiff(ref, vis) : refState.maxDiff;
    var showAll = maxD >= sliderMax; // the slider's far end means "everything"
    var limit = showAll ? Infinity : maxD;

    // Control states, and the settings in the address (replaceState: no history entry, no re-render)
    document.getElementById("ref-diff").value = Math.min(maxD, sliderMax);
    document.getElementById("ref-diff-val").textContent = showAll ? "Alla" : maxD.toFixed(2) + " %" + (auto ? " (auto)" : "");
    document.getElementById("ref-group").value = refGroupBp;
    document.getElementById("ref-group-val").textContent = refGroupBp ? "≤ " + refGroupBp + " bp" : "Av";
    var sb = document.getElementById("ref-susp");
    if (sb) sb.classList.toggle("on", refHideSuspicious);
    Array.prototype.forEach.call(view.querySelectorAll("a[data-mode]"), function (a) {
      var key = a.getAttribute("data-mode");
      a.classList.toggle("on", key === mode.key);
      a.setAttribute("href", ctx.hash(key) + refQuery());
    });
    var here = ctx.hash(mode.key) + refQuery();
    if (location.hash !== here) history.replaceState(null, "", here);

    // Neighbours within the limit, merged into groups
    var nbs = [], rows = [];
    vis.nbs.forEach(function (nb, i) {
      if (refDiffOf(nb) > limit) return;
      nbs.push(nb); rows.push(vis.rows[i]);
    });
    var rawCount = nbs.length;
    var cl = refCluster(ref, nbs, rows, refGroupBp, ownCount);
    var nbCl = [], ownGroups = [], ownCl = []; // cluster index of each plotted reference group / own group
    nbs = [];
    cl.forEach(function (c, ci) {
      if (c.nb) { nbs.push(c.nb); nbCl.push(ci); }
      if (c.own.length) { ownGroups.push(c.own); ownCl.push(ci); }
    });

    document.getElementById("ref-status").textContent = nbs.length
      ? nbs.length + (nbs.length === 1 ? " grupp" : " grupper") + " av " + rawCount + " närmaste COI-sekvenser" +
        (ownCount > 1 ? " · " + ownGroups.length + " av " + ownCount + " egna varianter" : "")
      : "Ingen referenssekvens inom " + maxD.toFixed(2) + " % skillnad. Dra slidern åt höger.";

    // Legend: groups by total records; the biggest few get a color.
    var totals = {};
    nbs.forEach(function (nb) {
      var c = nb[mode.field];
      Object.keys(c).forEach(function (k) { totals[k] = (totals[k] || 0) + c[k]; });
    });
    var rank = refColorRank(ref, mode); // fixed per individual and mode, so colors stay put while sliding
    var named = Object.keys(totals).filter(function (k) { return k !== ""; })
      .sort(function (a, b) { return rank[a] - rank[b]; });
    var colorOf = {};
    named.forEach(function (k) { colorOf[k] = rank[k] < REF_COLORS.length ? REF_COLORS[rank[k]] : REF_OTHER; });
    colorOf[""] = REF_NONE;
    var shown = named.filter(function (k) { return rank[k] < REF_COLORS.length; });
    var rest = named.length - shown.length;
    document.getElementById("ref-legend").innerHTML = shown.map(function (k) {
      return '<span class="lg" data-g="' + esc(k) + '"><span class="sw-dot" style="background:' + colorOf[k] + '"></span>' + esc(k) + " (" + totals[k] + ")</span>";
    }).join("") +
      (rest > 0 ? '<span class="lg" data-g="' + REF_OTHER_KEY + '"><span class="sw-dot" style="background:' + REF_OTHER + '"></span>övriga ' + mode.what + " (" + rest + ")</span>" : "") +
      (totals[""] ? '<span class="lg" data-g=""><span class="sw-dot" style="background:' + REF_NONE + '"></span>saknas (' + totals[""] + ")</span>" : "");

    // A group of sequences can hold several values (e.g. species): its point is a pie with the
    // commonest value as the base color and a wedge per other value, sized by record count.
    function groupColor(gk) { return gk === "" ? REF_NONE : (gk === REF_OTHER_KEY ? REF_OTHER : colorOf[gk]); }
    var gi = nbs.map(function (nb) {
      var counts = {}, total = 0;
      Object.keys(nb[mode.field]).forEach(function (key) {
        var gk = key === "" ? "" : (colorOf[key] === REF_OTHER ? REF_OTHER_KEY : key);
        counts[gk] = (counts[gk] || 0) + nb[mode.field][key];
        total += nb[mode.field][key];
      });
      var maj = refMajor(counts);
      return { counts: counts, total: total, maj: maj === null ? "" : maj };
    });

    document.getElementById("ref-list").innerHTML = nbs.map(function (nb, k) {
      return '<li data-k="' + k + '"' + (k >= refListShown ? ' class="off"' : "") + '><span class="li-main"><span class="sci">' +
        '<span class="sw-dot" style="background:' + groupColor(gi[k].maj) + '"></span>' + refTop(nb.species, 2) + "</span>" +
        '<span class="common">' + refTop(nb.bins, 2) + " · " + refTop(nb.countries, 3) + "</span></span>" +
        '<span class="li-meta"><strong>' + nb.identity.toFixed(1) + " %</strong> · " +
        nb.n + (nb.n === 1 ? " post" : " poster") + (nb.variants > 1 ? " · " + nb.variants + " sekvenser" : "") +
        ' · <a class="bold-link" target="_blank" rel="noopener" href="https://portal.boldsystems.org/record/' +
        encodeURIComponent(nb.ids[0].split(".")[0]) + '">BOLD →</a></span></li>';
    }).join("");

    // Distance between groups = closest pair of their sequences (own points are rows 0..ownCount-1), in %.
    var o;
    var sets = cl.map(function (c) { return c.rows; });
    var n = sets.length, D = [], i, j;
    function closest(a, b) {
      var best = Infinity;
      a.forEach(function (x) { b.forEach(function (y) { if (ref.dist[x][y] < best) best = ref.dist[x][y]; }); });
      return best / 10;
    }
    for (i = 0; i < n; i++) {
      D[i] = [];
      for (j = 0; j < n; j++) D[i][j] = i === j ? 0 : closest(sets[i], sets[j]);
    }
    var pts = smacof(D, mds2(D));
    // Fixed plot size (so nothing below it moves while a slider is dragged), fitted on both axes.
    var W = 520, H = 440, P = 20;
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs);
    var miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    var sx = maxx - minx, sy = maxy - miny;
    var scale = Math.min((W - 2 * P) / Math.max(sx, 0.5), (H - 2 * P - 14) / Math.max(sy, 0.5));
    var ox = (W - sx * scale) / 2 - minx * scale, oy = (H - 14 - sy * scale) / 2 - miny * scale;
    var nice = 0.5;
    [0.5, 1, 2, 5, 10, 20].forEach(function (c) { if (c * scale <= W * 0.3) nice = c; });

    var order = nbs.map(function (_, k) { return k; }).sort(function (a, b) { return nbs[b].n - nbs[a].n; });
    var pointGroups = gi.map(function (g) { return Object.keys(g.counts); });
    var marks = order.map(function (k) {
      var nb = nbs[k], counts = gi[k].counts, total = gi[k].total, maj = gi[k].maj;
      var cx = pts[nbCl[k]][0] * scale + ox, cy = pts[nbCl[k]][1] * scale + oy, r = 4 + 1.6 * Math.sqrt(nb.n - 1);
      var wedges = "", a0 = -Math.PI / 2 + 2 * Math.PI * counts[maj] / total;
      Object.keys(counts).forEach(function (gk) {
        if (gk === maj) return;
        var a1 = a0 + 2 * Math.PI * counts[gk] / total;
        wedges += '<path class="wedge" style="fill:' + groupColor(gk) + '" d="M' + cx.toFixed(1) + " " + cy.toFixed(1) +
          "L" + (cx + r * Math.cos(a0)).toFixed(1) + " " + (cy + r * Math.sin(a0)).toFixed(1) +
          "A" + r.toFixed(1) + " " + r.toFixed(1) + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " +
          (cx + r * Math.cos(a1)).toFixed(1) + " " + (cy + r * Math.sin(a1)).toFixed(1) + 'Z"/>';
        a0 = a1;
      });
      return '<g class="ptg" data-k="' + k + '"><circle class="pt" style="fill:' + groupColor(maj) + '" data-k="' + k + '" cx="' + cx.toFixed(1) +
        '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) + '"/>' + wedges + "</g>";
    }).join("");
    var me = '<g class="mes' + (ctx.ownTip ? " hit" : "") + '">';
    for (o = 0; o < ownGroups.length; o++) {
      var mx = +(pts[ownCl[o]][0] * scale + ox).toFixed(1), my = +(pts[ownCl[o]][1] * scale + oy).toFixed(1);
      me += '<path class="me" data-o="' + o + '" d="M' + mx + " " + (my - 12) + 'l12 12l-12 12l-12 -12z"/>';
    }
    me += "</g>";
    var barLen = Math.min(nice * scale, W - 2 * P - 40);
    var bar = '<line class="sbar" x1="' + P + '" x2="' + (P + barLen).toFixed(1) + '" y1="' + (H - 12) + '" y2="' + (H - 12) + '"/>' +
      '<text class="sbar-t" x="' + (P + barLen + 6).toFixed(1) + '" y="' + (H - 12) + '" dy="0.35em">' + nice + " %</text>";

    var plotEl = document.getElementById("plot");
    plotEl.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Scatter-plott av ' + esc(ctx.name) +
      " bland " + nbs.length + ' referenssekvenser">' + marks + me + bar + "</svg>";

    // Highlighting ties the legend, the points and the list rows together:
    //  - hovering a legend item (or tapping it, which pins it) lifts the points holding that
    //    value above the others and marks the list rows that hold it;
    //  - a selected point (click on it, or on its row) is ringed, and its row and values marked.
    var svgEl = plotEl.querySelector("svg"), meEl = svgEl.querySelector(".mes");
    var circles = order.map(function (k) { return svgEl.querySelector('g.ptg[data-k="' + k + '"]'); });
    var rowEls = Array.prototype.slice.call(document.querySelectorAll("#ref-list li"));
    var legEls = Array.prototype.slice.call(document.querySelectorAll("#ref-legend .lg"));
    var selK = null, hoverG, hoverK = null; // hoverG undefined = no legend item hovered
    nbs.forEach(function (nb, k) { if (refSel && nb.ids[0] === refSel) selK = k; });
    if (refPin !== null && !document.querySelector('#ref-legend .lg[data-g="' + refPin.replace(/"/g, '\\"') + '"]')) refPin = null;
    function paint() {
      var g = hoverG !== undefined ? hoverG : refPin;
      circles.forEach(function (c, i) {
        var on = g !== null && pointGroups[order[i]].indexOf(g) !== -1; // any point holding that value
        c.classList.toggle("dim", g !== null && !on);
        if (on) svgEl.insertBefore(c, meEl);
      });
      if (g === null) circles.forEach(function (c) { svgEl.insertBefore(c, meEl); }); // back to the size order
      circles.forEach(function (c, i) {
        var k = order[i];
        c.classList.toggle("sel", k === selK);
        c.classList.toggle("hov", k === hoverK && k !== selK);
        if (k === selK || k === hoverK) svgEl.insertBefore(c, meEl);
      });
      rowEls.forEach(function (li) {
        var k = +li.getAttribute("data-k");
        li.classList.toggle("hl", g !== null && pointGroups[k].indexOf(g) !== -1);
        li.classList.toggle("sel", k === selK);
      });
      legEls.forEach(function (el) {
        var eg = el.getAttribute("data-g");
        el.classList.toggle("on", g !== null && eg === g);
        el.classList.toggle("sel", selK !== null && pointGroups[selK].indexOf(eg) !== -1);
      });
    }
    function showRows(n) {
      refListShown = Math.max(refListShown, n);
      rowEls.forEach(function (li) { li.classList.toggle("off", +li.getAttribute("data-k") >= refListShown); });
      var left = nbs.length - refListShown;
      document.getElementById("ref-more").innerHTML = left > 0 ? '<button class="sort-btn" id="ref-more-btn">Visa fler (' + left + ")</button>" : "";
      var btn = document.getElementById("ref-more-btn");
      if (btn) btn.addEventListener("click", function () { showRows(refListShown + 25); });
    }
    function select(k, fromGraph) {
      selK = selK === k ? null : k;
      refSel = selK === null ? null : nbs[selK].ids[0];
      if (selK !== null) showRows(selK + 1);
      paint();
      if (selK === null) return;
      if (fromGraph) rowEls[selK].scrollIntoView({ block: "nearest", behavior: "smooth" });
      else plotEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    legEls.forEach(function (el) {
      var g = el.getAttribute("data-g");
      el.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") { hoverG = g; paint(); } });
      el.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") { hoverG = undefined; paint(); } });
      el.addEventListener("click", function () { refPin = refPin === g ? null : g; paint(); });
    });
    rowEls.forEach(function (li) {
      var k = +li.getAttribute("data-k");
      li.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") { hoverK = k; paint(); } });
      li.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") { hoverK = null; paint(); } });
      li.addEventListener("click", function (e) { if (!e.target.closest("a")) select(k, false); });
    });
    showRows(selK === null ? 0 : selK + 1);
    paint();

    var tip = document.getElementById("tip"), wrap = plotEl.parentNode;
    tip.hidden = true;
    if (ctx.ownTip) {
      Array.prototype.forEach.call(plotEl.querySelectorAll("path.me"), function (el) {
        var v = { n: 0, slugs: [] };
        ownGroups[+el.getAttribute("data-o")].forEach(function (i) { v.n += ref.own[i].n; v.slugs = v.slugs.concat(ref.own[i].slugs); });
        var recs = v.slugs.map(function (sl) { return slugMap[sl]; }).filter(Boolean);
        chartTip(el, wrap, tip, function (touch) {
          tip.innerHTML = "<strong>" + v.n + (v.n === 1 ? " individ" : " individer") + "</strong>" +
            recs.slice(0, 8).map(function (r) {
              return "<div>" + esc([r["Samlings-nummer"] || r["ID"], r["Provins"]].filter(Boolean).join(" · ")) + "</div>";
            }).join("") + (recs.length > 8 ? "<div>+" + (recs.length - 8) + " till</div>" : "") + touchHint(touch);
        }, function () {}, function () { if (recs[0]) goDetail(recs[0]); });
      });
    }
    Array.prototype.forEach.call(plotEl.querySelectorAll("circle.pt"), function (c) {
      var nb = nbs[+c.getAttribute("data-k")], pid = nb.ids[0].split(".")[0];
      chartTip(c, wrap, tip, function (touch) {
        tip.innerHTML = "<strong>" + nb.identity.toFixed(2) + " % lika" + (ctx.ownTip ? " närmaste variant" : "") + (nb.variants > 1 ? " (närmaste)" : "") + "</strong> · " + nb.n + (nb.n === 1 ? " post" : " poster") +
          "<div>Art: " + refTop(nb.species, 3) + "</div><div>BIN: " + refTop(nb.bins, 3) + "</div>" +
          "<div>Land: " + refTop(nb.countries, 3) + "</div>" +
          (nb.variants > 1 ? "<div>" + nb.variants + " sekvenser i gruppen (störst skillnad " + (nb.spread / 10).toFixed(1) + " %)</div>" : "") +
          (nb.suspicious ? "<div>Misstänkta: " + nb.suspicious + "</div>" : "") +
          '<div class="tip-near">' + esc(pid) + "</div>" + (touch ? '<div class="tip-hint">Tryck igen för att markera</div>' : "");
      }, function () {}, function () { select(+c.getAttribute("data-k"), true); });
    });
  }

  // --- Species page: the name checked against BOLD, and BOLD's BINs for the name ---
  // Data from scripts/build_ref_summary.py (window.DNA_REF_SUMMARY, per individual) and
  // scripts/build_species_reference.py (window.DNA_REF_SPECIES, per species name).
  function refBinLink(bin) {
    return '<a href="https://portal.boldsystems.org/bin/' + encodeURIComponent(bin) + '" target="_blank" rel="noopener">' + esc(bin) + "</a>";
  }
  function refPct(v) { return v.toFixed(2).replace(/\.?0+$/, "") + " %"; }

  function speciesRefHtml(sp) {
    var info = window.DNA_REF_SPECIES && window.DNA_REF_SPECIES[sp.name];
    var sums = window.DNA_REF_SUMMARY || {};
    var checked = sp.members.filter(function (r) { return sums[r.__slug]; });
    if (!checked.length && !info) return "";
    var html = "";

    if (checked.length) {
      var cnt = { ok: 0, stav: 0, annat: 0, langt: 0, okand: 0 };
      checked.forEach(function (r) { cnt[sums[r.__slug].st]++; });
      var odd = checked.filter(function (r) { return sums[r.__slug].st !== "ok"; });
      html += '<div class="seq-header"><h3>Artbestämning mot BOLD</h3>' +
        (info ? '<a class="tree-link" href="' + speciesRefHash(sp) + '">Referensdata →</a>' : "") + "</div>" +
        '<div class="chart-note">Individens namn jämfört med artnamnen på de närmaste sekvenserna i BOLD. ' +
          "Stämmer = namnet finns bland de närmaste namngivna (inom 0,3 procentenheter av den närmaste).</div>" +
        '<div class="chart-note"><strong>' + cnt.ok + " stämmer</strong>" +
          (cnt.stav ? " · " + cnt.stav + " med annan stavning i BOLD" : "") +
          (cnt.annat ? " · <strong>" + cnt.annat + " annat namn närmare</strong>" : "") +
          (cnt.langt ? " · " + cnt.langt + " utan namngiven sekvens nära" : "") +
          (cnt.okand ? " · " + cnt.okand + " utan artnamn" : "") + "</div>";
      if (odd.length) {
        html += '<ul class="list species-rows refbox">' + odd.map(function (r) {
          var e = sums[r.__slug], what;
          if (e.st === "stav") {
            what = "BOLD stavar <i>" + Object.keys(e.best).map(esc).join(", ") + "</i>";
          } else if (e.st === "annat") {
            what = "närmast <i>" + Object.keys(e.best).map(esc).join(", ") + "</i> (" + refPct(e.d0) + ")" +
              (e.own_d !== null && e.own_d !== undefined ? ", eget namn först på " + refPct(e.own_d) : ", eget namn finns inte bland de närmaste");
          } else if (e.st === "langt") {
            what = e.d0 === undefined ? "inga namngivna sekvenser bland de närmaste" : "närmaste namngivna sekvens är " + refPct(e.d0) + " bort";
          } else {
            what = "saknar artnamn att jämföra";
          }
          return '<li><span class="li-main"><span class="sn">' + esc(r["Samlings-nummer"] || r["ID"] || "—") + "</span>" +
            '<span class="common">' + what + "</span></span>" +
            '<span class="li-meta"><a href="#/i/' + encodeURIComponent(r.__slug) + '">individ →</a> ' +
            '<a href="' + refHash(r) + '">referens →</a></span></li>';
        }).join("") + "</ul>";
      }
    }

    html += '<div class="seq-header"><h3>BOLD:s BIN:ar för namnet</h3></div>';
    if (!info) return html + '<div class="chart-note">Namnet kan inte slås upp i BOLD (inget artnamn).</div>';
    if (!info.named) return html + '<div class="chart-note">Namnet finns inte på några poster i det hämtade BOLD-datat.</div>';
    var ownIn = info.own_bins || {}, listed = {};
    info.bins.forEach(function (b) { listed[b.bin] = 1; });
    var notes = [];
    if (info.bins.length > 1) notes.push("Namnet finns i " + info.bins.length + " olika BIN:ar.");
    if (info.bins.some(function (b) { return b.n_others > 0; })) notes.push("Minst en BIN delas med andra namn.");
    var elsewhere = Object.keys(ownIn).filter(function (b) { return !listed[b]; });
    html += '<div class="chart-note">' + info.named + (info.named === 1 ? " post" : " poster") + " med namnet i BOLD, i " +
      info.bins.length + (info.bins.length === 1 ? " BIN" : " BIN:ar") + (info.no_bin ? " (+" + info.no_bin + " utan BIN)" : "") + "." +
      (notes.length ? " " + notes.join(" ") : "") + "</div>" +
      '<ul class="list species-rows refbox">' + info.bins.map(function (b) {
        var others = Object.keys(b.others).sort(function (x, y) { return b.others[y] - b.others[x]; });
        var mine = ownIn[b.bin] || 0;
        return "<li><span class=\"li-main\"><span class=\"sn\">" + refBinLink(b.bin) + " · " + b.n + " av " + b.total + " poster har namnet</span>" +
          '<span class="common">' + (others.length
            ? "Delas med: " + others.slice(0, 4).map(function (k) { return (k === "" ? "okänd" : "<i>" + esc(k) + "</i>") + " ×" + b.others[k]; }).join(", ") +
              (b.n_others > 4 ? " +" + (b.n_others - 4) : "") + ". "
            : "Bara det här namnet. ") + "Länder: " + refTop(b.countries, 4) + "</span></span>" +
          '<span class="li-meta"><strong>' + mine + "</strong> " + (mine === 1 ? "av dina individer" : "av dina individer") + "</span></li>";
      }).join("") + "</ul>" +
      (elsewhere.length
        ? '<div class="chart-note">Dina övriga individer: ' + elsewhere.map(function (b) {
            return (b === "" ? "utan BIN-träff" : "i " + refBinLink(b)) + " ×" + ownIn[b];
          }).join(", ") + ".</div>"
        : "");
    return html;
  }

  // --- Hash-based routing (GitHub Pages friendly; survives reload & deep links) ---
  //   #/            → species list
  //   #/s/<art>     → species (individuals + COI scatter plot + nearest species)
  //   #/s/<a>/<b>   → the same, with species b plotted alongside a
  //   #/i/<slug>    → individual detail
  //   #/c/<a>/<b>   → comparison
  //   #/r/<slug>[/<art|land|bin>][?d=<max %>&g=<bp>&s=1] → individual among BOLD reference sequences
  //   #/sr/<art>[/<art|land|bin>][?...] → the species' COI variants among BOLD reference sequences
  //   #/t/<art>[/<n>] → species tree from <art> and its n nearest species
  //   #/v/<slug>[/<n>[/<t>]] → tree of COI variants from an individual and its n nearest
  //                         nodes, variants within t differences grouped
  function goList() { setHash("/"); }
  function variantTreeHash(rec, n, t) {
    n = n || VTREE_DEFAULT; if (t === undefined) t = VTREE_T_DEFAULT; // 0 is a valid threshold
    return "#/v/" + encodeURIComponent(rec.__slug) +
      (n !== VTREE_DEFAULT || t !== VTREE_T_DEFAULT ? "/" + n + (t !== VTREE_T_DEFAULT ? "/" + t : "") : "");
  }
  function treeHash(sp, n) {
    return "#/t/" + encodeURIComponent(sp.slug) + (n && n !== TREE_DEFAULT ? "/" + n : "");
  }
  function speciesHash(sp, others) {
    return "#/s/" + [sp].concat(others || []).map(function (s) { return encodeURIComponent(s.slug); }).join("/");
  }
  function goSpecies(sp, others) { setHash(speciesHash(sp, others).slice(1)); }
  function goDetail(rec) { setHash("/i/" + encodeURIComponent(rec.__slug)); }
  function goCompare(a, b) { setHash("/c/" + encodeURIComponent(a.__slug) + "/" + encodeURIComponent(b.__slug)); }

  function setHash(h) {
    if (location.hash !== "#" + h) location.hash = h; // triggers hashchange → route()
    else route();                                     // same hash: render directly
  }

  function resolve(slug) {
    slug = decodeURIComponent(slug || "");
    return slugMap[slug] || snFirst[slug] || null;
  }

  function route() {
    var hash = location.hash.replace(/^#/, ""), qi = hash.indexOf("?");
    var query = qi === -1 ? "" : hash.slice(qi + 1);
    var parts = (qi === -1 ? hash : hash.slice(0, qi)).split("/").filter(Boolean);
    if (parts[0] === "s" && parts[1]) {
      var sp = speciesMap[decodeURIComponent(parts[1])];
      var others = [];
      parts.slice(2, 2 + MAX_OTHERS).forEach(function (p) {
        var o = speciesMap[decodeURIComponent(p)];
        if (o && o !== sp && others.indexOf(o) === -1) others.push(o);
      });
      if (sp) { renderSpecies(sp, others); return; }
    } else if (parts[0] === "t" && parts[1]) {
      var base = speciesMap[decodeURIComponent(parts[1])];
      var cnt = TREE_COUNTS.indexOf(+parts[2]) !== -1 ? +parts[2] : TREE_DEFAULT;
      if (base) { renderSpeciesTree(base, cnt); return; }
    } else if (parts[0] === "v" && parts[1]) {
      var vr = resolve(parts[1]);
      var vc = VTREE_COUNTS.indexOf(+parts[2]) !== -1 ? +parts[2] : VTREE_DEFAULT;
      var vt = VTREE_THRESHOLDS.indexOf(+parts[3]) !== -1 ? +parts[3] : VTREE_T_DEFAULT;
      if (vr) { renderVariantTree(vr, vc, vt); return; }
    } else if (parts[0] === "sr" && parts[1]) {
      var rsp = speciesMap[decodeURIComponent(parts[1])];
      if (rsp && hasSpeciesRef(rsp)) { renderSpeciesRef(rsp, parts[2], query); return; }
    } else if (parts[0] === "r" && parts[1]) {
      var rr = resolve(parts[1]);
      if (rr && hasRef(rr)) { renderRef(rr, parts[2], query); return; }
    } else if (parts[0] === "i" && parts[1]) {
      var r = resolve(parts[1]);
      if (r) { renderDetail(r); return; }
    } else if (parts[0] === "c" && parts[1] && parts[2]) {
      var a = resolve(parts[1]), b = resolve(parts[2]);
      if (a && b) { renderCompare(a, b); return; }
    }
    renderList();
  }

  window.addEventListener("hashchange", route);

  // Typing in the filter always returns to (and re-renders) the list.
  filterEl.addEventListener("input", function () {
    if (location.hash !== "#/") location.hash = "#/"; else renderList();
  });

  route();
})();
</script>
