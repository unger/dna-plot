<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleophora – DNA</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --muted: #6b6b76;
    --accent: #2f6feb;
    --accent-soft: #eaf0fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  header h1 { margin: 0 0 10px; font-size: 18px; }
  header h1 .count { color: var(--muted); font-weight: 400; font-size: 14px; }
  #filter {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }
  #filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

  main { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; }

  /* List */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  ul.list li:hover { border-color: var(--accent); background: var(--accent-soft); }
  .li-main { display: flex; flex-direction: column; }
  .sci { font-weight: 600; font-style: italic; }
  .common { color: var(--muted); font-size: 13px; }
  .li-meta { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  .li-meta strong { color: var(--text); }
  .li-meta .spread { display: block; font-size: 12px; }
  .sort-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
  .sort-bar .lbl { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .sort-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .sort-btn:hover { border-color: var(--accent); }
  .sort-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .species-link { color: var(--accent); }

  /* Species page */
  .sn { font-weight: 600; }
  .taxon-head { margin: 16px 0 6px; font-size: 14px; }
  .taxon-head:first-child { margin-top: 0; }
  .taxon-head span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  ul.species-rows li { padding: 7px 12px; margin-bottom: 6px; }
  ul.species-rows li.sp-group { display: block; padding: 0; overflow: hidden; cursor: default; }
  ul.species-rows li.sp-group:hover { border-color: var(--border); background: var(--panel); }
  ul.species-rows li.sp-group .grouphead { padding: 7px 12px; align-items: baseline; justify-content: space-between; }
  ul.species-rows.nested {
    margin: 0; padding: 4px 8px 8px 16px; background: #fafafb;
    border-top: 1px solid var(--border);
  }
  ul.species-rows.nested li { margin-bottom: 4px; }
  ul.species-rows li.hl, ul.species-rows li.sp-group.hl { border-color: var(--accent); background: var(--accent-soft); }
  .chart-note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .plot-wrap { position: relative; }
  .plot-wrap svg { display: block; width: 100%; height: auto; }
  .plot-wrap .pt { fill-opacity: 0.9; stroke: #fff; stroke-width: 2; cursor: pointer; }
  .legend-sp { font-size: 13px; margin: 0 0 6px; }
  .sw-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 5px 0 0; }
  .ctl { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; }
  .ctl .lbl { flex: none; width: 96px; font-size: 13px; color: var(--muted); }
  .ctl input[type=range] { flex: 1; min-width: 0; height: 28px; margin: 0; }
  .ctl .ctl-val { flex: none; width: 90px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ctl-note { color: var(--muted); font-size: 12px; margin: 8px 0 8px; }
  ul.refrows li.off { display: none; }
  ul.refrows li.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  ul.refrows .bold-link { white-space: nowrap; }
  .plot-wrap .ptg.sel .pt, .plot-wrap .ptg.hov .pt { stroke: var(--text); stroke-width: 3; }
  .legend-sp .lg.sel { font-weight: 600; text-decoration: underline; }
  ul.refbox li { cursor: default; }
  ul.refbox li:hover { border-color: var(--border); background: var(--panel); }
  ul.refbox li a { margin-right: 6px; }
  .plot-wrap .wedge { pointer-events: none; }
  .plot-wrap .mes.hit .me { pointer-events: stroke; cursor: pointer; }
  .plot-wrap .ptg.dim .pt, .plot-wrap .ptg.dim .wedge { fill-opacity: 0.3; }
  .legend-sp .lg.on { font-weight: 600; }
  .legend-sp .lg { cursor: pointer; display: inline-block; white-space: nowrap; margin-right: 14px; }
  .plot-wrap .me { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linejoin: round; pointer-events: none; } /* hollow: points beneath stay visible and hoverable */
  .legend-sp .sw-dot + i { margin-right: 14px; }
  .near-q {
    width: 100%; padding: 7px 10px; font-size: 14px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .open-sp { color: var(--accent); white-space: nowrap; }
  .tree svg { display: block; width: 100%; height: auto; }
  .tree .br { stroke: #8a95a5; stroke-width: 1.5; }
  .tree .sbar { stroke: var(--muted); stroke-width: 2; }
  .tree .brk { stroke: var(--muted); stroke-width: 1.5; }
  .tree .sbar-t { fill: var(--muted); font-size: 11px; }
  .tree .leaf { cursor: pointer; }
  .tree .leaf text { fill: var(--text); font-size: 11px; }
  .tree .leaf:hover text { text-decoration: underline; }
  .tree-link { color: var(--accent); font-size: 13px; white-space: nowrap; }
  .li-meta .tree-link { font-size: 12px; margin-left: 10px; }
  .tree .base circle { fill: var(--accent); }
  .tree .base text { fill: var(--text); font-size: 12px; font-weight: 600; }
  .tree .leaf .d { fill: var(--muted); }
  .sptree { margin-top: 8px; }
  .sptree-rows .li-meta a { margin-left: 10px; color: var(--accent); }
  a.sort-btn, a.back { text-decoration: none; }
  .near-q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  ul.near-rows li.sel { border-color: var(--accent); background: var(--accent-soft); }
  .plot-wrap .pt:hover, .plot-wrap .pt.hl { stroke: var(--text); }
  .plot-wrap .pt-n { fill: #fff; font: 600 10px/1 -apple-system, "Segoe UI", sans-serif; text-anchor: middle; pointer-events: none; }
  .plot-wrap .sbar { stroke: var(--muted); stroke-width: 2; }
  .plot-wrap .sbar-t { fill: var(--muted); font-size: 11px; }
  .hist { margin-bottom: 18px; }
  .hist .grid { stroke: #eeeef1; stroke-width: 1; }
  .hist .base { stroke: #b9bcc6; stroke-width: 1; }
  .hist .ax { fill: var(--muted); font-size: 11px; text-anchor: end; }
  .hist .gap { stroke: #c9ccd4; stroke-width: 1; }
  .hist .gap-t { text-anchor: middle; }
  .hist .hit { fill: transparent; }
  .hist .hbar { cursor: pointer; }
  .hist .bar { fill: #2a78d6; }
  .hist .hbar:hover .bar, .hist .hbar.hl .bar { fill: #1d5fae; }
  .hist .cnt { fill: var(--text); font-size: 11px; text-anchor: middle; }
  .tip-near { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; color: var(--muted); }
  .tip-hint { color: var(--muted); font-style: italic; margin-top: 4px; }
  .tip {
    position: absolute; z-index: 3; pointer-events: none; max-width: 300px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }

  /* Detail */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--accent);
    font-size: 15px; cursor: pointer; padding: 4px 0; margin-bottom: 12px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .card h2 { margin: 0; font-style: italic; }
  .card .subtitle { color: var(--muted); margin: 2px 0 18px; }

  /* Detail layout: stacked by default, Närmast lika moves to a right column when wide. */
  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .detail-main { min-width: 0; }
  .detail-side { min-width: 0; }
  @media (min-width: 820px) {
    .detail-grid { grid-template-columns: 1fr 1fr; align-items: start; }
    .detail-side .seq-header, .detail-main > .seq-header:first-child { margin-top: 0; }
  }
  dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 18px; margin: 0; }
  dl.fields dt { color: var(--muted); }
  dl.fields dd { margin: 0; word-break: break-word; }
  dl.fields a { color: var(--accent); }
  dl.fields .link-row { grid-column: 1 / -1; margin: 4px 0 0; word-break: break-all; }

  .seq-header { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 8px; }
  .seq-header h3 { margin: 0; font-size: 15px; }
  .copy-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 7px 14px; font-size: 14px; cursor: pointer;
  }
  .copy-btn.ok { background: #2f9e57; }
  pre.seq {
    margin: 0; padding: 10px 12px;
    background: #0f1117; color: #d7e0ef;
    border-radius: 8px; overflow-x: auto;
    font: 12px/1.5 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    letter-spacing: 0.3px;
  }
  .seq .pos { color: #5c6579; user-select: none; margin-right: 14px; }

  ul.similar { list-style: none; margin: 0; padding: 0; }
  ul.similar li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; cursor: pointer;
  }
  ul.similar li:hover { border-color: var(--accent); background: var(--accent-soft); }
  ul.similar .sci { font-size: 14px; }
  ul.similar .common { font-size: 12px; }
  .pct {
    font: 600 14px/1 "SF Mono", "Cascadia Code", Consolas, monospace;
    white-space: nowrap; text-align: right;
  }
  .pct small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .show-more {
    background: none; border: none; color: var(--accent);
    font-size: 14px; cursor: pointer; padding: 6px 0; margin-top: 2px;
  }
  .show-more:hover { text-decoration: underline; }

  /* Collapsed identical-COI group */
  ul.similar li.sim-group {
    display: block; padding: 0; cursor: default; overflow: hidden;
  }
  ul.similar li.sim-group:hover { border-color: var(--border); background: transparent; }
  .grouphead {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; cursor: pointer;
  }
  .grouphead:hover { background: var(--accent-soft); }
  .expand-link { color: var(--accent); cursor: pointer; white-space: nowrap; }
  .expand-link:hover { text-decoration: underline; }
  ul.similar.nested {
    margin: 0; padding: 4px 8px 8px 16px; background: #fafafb;
    border-top: 1px solid var(--border);
  }
  ul.similar.nested li { margin-bottom: 4px; }

  ul.similar li .li-main { flex: 1 1 auto; min-width: 0; }
  .cmp-btn {
    flex: none; background: #fff; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .cmp-btn:hover { background: var(--accent-soft); }

  /* Compare view */
  .cmp-summary { margin-bottom: 8px; }
  .cmp-summary .pct { font-size: 15px; }
  .legend { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
  .legend .sw {
    display: inline-block; width: 13px; height: 13px; border-radius: 3px;
    vertical-align: -2px; margin: 0 4px 0 12px;
  }
  .legend .sw:first-child { margin-left: 0; }
  .sw-mm { background: #6c5ce7; }
  .sw-eq { background: #c9edf1; }
  .sw-gp { background: #f6d18b; }

  .align-wrap { text-align: center; }
  pre.align {
    display: inline-block; max-width: 100%; text-align: left;
    margin: 0; padding: 10px 14px; background: #fff; color: #1a1a1e;
    border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;
    font: 13px/1.15 "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  }
  pre.align .sb { background: #c9edf1; }
  pre.align .mm { background: #6c5ce7; color: #fff; }
  pre.align .gp { background: #f6d18b; color: #7a5a12; }
  pre.align .tb { color: #8a95a5; }

  .compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 22px; }
  .compare-cols .col { min-width: 0; }
  .compare-cols .col h3 { font-style: italic; margin: 0; }
  .compare-cols .col h4 { margin: 20px 0 8px; font-size: 14px; }
  .open-detail {
    background: none; border: none; color: var(--accent);
    font-size: 14px; cursor: pointer; padding: 2px 0; margin: 4px 0 12px;
  }
  .open-detail:hover { text-decoration: underline; }
  @media (max-width: 700px) { .compare-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Coleophora <span class="count" id="count"></span></h1>
  <input id="filter" type="search" placeholder="Filtrera – mellanslagsseparerade ord…" autocomplete="off">
  <div class="hint">Söker i artnamn, vetenskapligt namn, lokalnamn, provins och samlingsnummer. Alla ord måste matcha.</div>
</header>
<main id="view"></main>

<script src="data.js"></script>
<script src="ref/index.js"></script>
<script src="ref/summary.js"></script>
<script src="ref/species.js"></script>
<script>
(function () {
  "use strict";

  var SEARCH_FIELDS = ["Artnamn", "Vetenskapligt namn", "Lokalnamn", "Provins", "Samlings-nummer"];

  // Fields shown on the detail page, in order. [key, label]
  var DETAIL_FIELDS = [
    ["Lokalnamn", "Lokalnamn"],
    ["Provins", "Provins"],
    ["Startdatum", "Startdatum"],
    ["Substrat", "Substrat"],
    ["Samlings-nummer", "Samlingsnummer"],
    ["Underfamilj", "Underfamilj"],
    ["__taxon", "Släkte/art"],
    ["Projekt", "Projekt"],
    ["ID", "ID"],
    ["Length", "Längd (bp)"],
    ["Data2", "Data2"]
  ];

  // Keep only Coleophora, sorted alphabetically by scientific name.
  var records = (window.DNA_DATA || [])
    .filter(function (r) { return r["Släkte"] === "Coleophora"; })
    .map(function (r, i) {
      r.__i = i;
      r.__taxon = [r["Släkte"], r["Art"]].filter(Boolean).join(" ");
      return r;
    });

  records.sort(function (a, b) {
    var sa = (a["Vetenskapligt namn"] || "").toLowerCase();
    var sb = (b["Vetenskapligt namn"] || "").toLowerCase();
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  });

  // URL slug per individual: the collection number when unique, otherwise
  // "<samlingsnummer>~<ID>" so the few duplicates still get a unique link.
  var snCount = {};
  records.forEach(function (r) {
    var sn = r["Samlings-nummer"];
    if (sn) snCount[sn] = (snCount[sn] || 0) + 1;
  });
  var slugMap = {}, snFirst = {};
  records.forEach(function (r) {
    var sn = r["Samlings-nummer"];
    r.__slug = (sn && snCount[sn] === 1) ? sn
             : (sn ? sn + "~" + r["ID"] : r["ID"]);
    slugMap[r.__slug] = r;
    if (sn && !(sn in snFirst)) snFirst[sn] = r; // fallback for a bare, duplicated sn
  });

  // Species = unique "Vetenskapligt namn". Records are already sorted by it.
  // URL slug is the name with underscores for spaces (looked up via speciesMap).
  var speciesList = [], speciesMap = {}, speciesByName = {};
  records.forEach(function (r) {
    var name = r["Vetenskapligt namn"] || "Okänd art";
    r.__species = name;
    var sp = speciesByName[name];
    if (!sp) {
      sp = speciesByName[name] = { name: name, slug: name.replace(/\s+/g, "_"), members: [] };
      speciesMap[sp.slug] = sp;
      speciesList.push(sp);
    }
    sp.members.push(r);
  });

  var view = document.getElementById("view");
  var filterEl = document.getElementById("filter");
  var countEl = document.getElementById("count");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function matches(rec, words) {
    var hay = SEARCH_FIELDS.map(function (f) { return rec[f] || ""; }).join(" ").toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  }

  function currentMatches() {
    var words = filterEl.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return records.slice();
    return records.filter(function (r) { return matches(r, words); });
  }

  function commonName(sp) {
    return (sp.members.filter(function (r) { return r["Artnamn"]; })[0] || {})["Artnamn"] || "";
  }

  // Start-page sorting. `dir` is the default direction when a key is first
  // picked; the second click flips it, the third resets to the default order
  // (sortState null = Latin A–Ö, no button active). Missing values sort last.
  var SORTS = [
    { key: "sci", label: "Latinskt", dir: 1, val: function (sp) { return sp.name.toLowerCase(); } },
    { key: "common", label: "Svenskt", dir: 1, val: function (sp) { return commonName(sp).toLowerCase() || null; } },
    { key: "count", label: "Antal individer", dir: -1, val: function (sp, n) { return n; } },
    { key: "spread", label: "Spridning", dir: -1, val: function (sp) { var s = intraSpread(sp); return s ? s.max : null; } }
  ];
  var sortState = null;

  function sortDef(k) { return SORTS.filter(function (s) { return s.key === k; })[0]; }

  function sortSpecies(shown, matched) {
    var st = sortState || { key: "sci", dir: 1 };
    var def = sortDef(st.key);
    var vals = {};
    shown.forEach(function (sp) { vals[sp.name] = def.val(sp, matched[sp.name].length); });
    return shown.slice().sort(function (a, b) {
      var va = vals[a.name], vb = vals[b.name];
      if (va === null || vb === null) {
        if (va !== vb) return va === null ? 1 : -1;
      } else if (va !== vb) {
        var c = typeof va === "string" ? va.localeCompare(vb, "sv") : (va < vb ? -1 : 1);
        if (c) return c * st.dir;
      }
      return a.name.localeCompare(b.name, "sv"); // tiebreak
    });
  }

  function sortBar() {
    var bar = document.createElement("div");
    bar.className = "sort-bar";
    bar.innerHTML = '<span class="lbl">Sortera:</span>' + SORTS.map(function (s) {
      var on = !!sortState && s.key === sortState.key;
      return '<button class="sort-btn' + (on ? " on" : "") + '" data-sort="' + s.key + '">' +
        esc(s.label) + (on ? (sortState.dir === 1 ? " ↑" : " ↓") : "") + "</button>";
    }).join("");
    Array.prototype.forEach.call(bar.querySelectorAll("[data-sort]"), function (btn) {
      btn.addEventListener("click", function () {
        var k = btn.getAttribute("data-sort");
        var d = sortDef(k).dir;
        if (!sortState || sortState.key !== k) sortState = { key: k, dir: d };
        else if (sortState.dir === d) sortState.dir = -d;
        else sortState = null;
        renderList();
      });
    });
    return bar;
  }

  function renderList() {
    var list = currentMatches();
    var matched = {};
    list.forEach(function (r) { (matched[r.__species] = matched[r.__species] || []).push(r); });
    var shown = sortSpecies(speciesList.filter(function (sp) { return matched[sp.name]; }), matched);
    countEl.textContent =
      "(" + shown.length + (shown.length === 1 ? " art" : " arter") +
      " · " + list.length + (list.length === 1 ? " individ)" : " individer)");

    if (!shown.length) {
      view.innerHTML = '<p class="empty">Inga träffar.</p>';
      return;
    }

    var ul = document.createElement("ul");
    ul.className = "list";
    shown.forEach(function (sp) {
      var n = matched[sp.name].length, total = sp.members.length;
      var common = commonName(sp);
      var li = document.createElement("li");
      li.innerHTML =
        '<span class="li-main">' +
          '<span class="sci">' + esc(sp.name) + '</span>' +
          '<span class="common">' + esc(common) + '</span>' +
        '</span>' +
        '<span class="li-meta"><strong>' + n + (n !== total ? " av " + total : "") + "</strong> " +
          (total === 1 ? "individ" : "individer") + spreadHtml(sp) + '</span>';
      li.addEventListener("click", function () { goSpecies(sp); });
      ul.appendChild(li);
    });
    view.innerHTML = "";
    view.appendChild(sortBar());
    view.appendChild(ul);
  }

  // % identity between two equal-length COI sequences, comparing position by
  // position. Positions where either base is N (ambiguous) are excluded.
  function coiIdentity(a, b) {
    var n = Math.min(a.length, b.length);
    var compared = 0, match = 0, missing = 0, missingA = 0, missingB = 0;
    for (var i = 0; i < n; i++) {
      var ca = a[i], cb = b[i];
      var na = ca === "N", nb = cb === "N";
      if (na) missingA++;
      if (nb) missingB++;
      if (na || nb) { missing++; continue; }
      compared++;
      if (ca === cb) match++;
    }
    return {
      pct: compared ? (match / compared * 100) : 0,
      diffs: compared - match, compared: compared,
      missing: missing, missingA: missingA, missingB: missingB
    };
  }

  // Intra-species COI spread: max and mean pairwise difference (%) between
  // individuals with COI. Null when fewer than two have COI. Cached per species.
  var spreadCache = {};
  function intraSpread(sp) {
    if (sp.slug in spreadCache) return spreadCache[sp.slug];
    var seqs = sp.members.filter(function (r) { return r["COI"]; });
    var res = null;
    if (seqs.length > 1) {
      var max = 0, sum = 0, pairs = 0;
      for (var i = 0; i < seqs.length; i++) {
        for (var j = i + 1; j < seqs.length; j++) {
          var d = 100 - coiIdentity(seqs[i]["COI"], seqs[j]["COI"]).pct;
          if (d > max) max = d;
          sum += d; pairs++;
        }
      }
      res = { max: max, mean: sum / pairs, n: seqs.length };
    }
    return (spreadCache[sp.slug] = res);
  }
  function spreadHtml(sp) {
    var s = intraSpread(sp);
    if (!s) return '<span class="spread">spridning —</span>';
    return '<span class="spread" title="Medel ' + s.mean.toFixed(2) + " % · " + s.n +
      ' individer med COI">spridning max ' + s.max.toFixed(1) + " %</span>";
  }

  var SIMILAR_STEP = 10; // how many to show initially and per "Visa fler"

  // All individuals ranked by COI similarity to `rec`, most similar first.
  function similarTo(rec) {
    var seq = rec["COI"];
    if (!seq) return [];
    return records
      .filter(function (o) { return o !== rec && o["COI"]; })
      .map(function (o) { return { rec: o, id: coiIdentity(seq, o["COI"]) }; })
      .sort(function (a, b) { return b.id.pct - a.id.pct; });
  }

  // Split COI into groups of 10, 4 groups per row, space-separated for display only.
  // N (ambiguous/missing) bases are shown as a dash for readability.
  function formatSeq(seq) {
    seq = seq.replace(/N/g, "-");
    var html = "";
    var groups = [];
    for (var i = 0; i < seq.length; i += 10) groups.push(seq.slice(i, i + 10));
    for (var g = 0; g < groups.length; g += 4) {
      html += esc(groups.slice(g, g + 4).join(" ")) + "\n";
    }
    return html;
  }

  // Metadata definition list for one record (shared by detail and compare).
  function fieldsHtml(rec) {
    var rows = DETAIL_FIELDS.filter(function (f) {
      var v = rec[f[0]];
      return v !== null && v !== undefined && v !== "";
    }).map(function (f) {
      return "<dt>" + esc(f[1]) + "</dt><dd>" + esc(rec[f[0]]) + "</dd>";
    }).join("");
    var link = rec["Länk"]
      ? '<dt>Länk</dt><dd><a href="' + esc(rec["Länk"]) + '" target="_blank" rel="noopener">Artportalen ↗</a></dd>'
      : "";
    return '<dl class="fields">' + rows + link + "</dl>";
  }

  function diffLabel(d) { return d + (d === 1 ? " skillnad" : " skillnader"); }
  function idLabel(id) {
    var s = diffLabel(id.diffs);
    // Only count bases missing (N) on the compared individual (the second arg
    // to coiIdentity), so the reference's own N's don't inflate every row.
    if (id.missingB) s += " · " + id.missingB + " saknade";
    return s;
  }
  function pctHtml(s) {
    return '<span class="pct">' + s.id.pct.toFixed(1) + " %<small>" + idLabel(s.id) + "</small></span>";
  }
  function metaLine(rec) {
    return esc(rec["Artnamn"] || "") +
      (rec["Provins"] ? " · " + esc(rec["Provins"]) : "") +
      (rec["Samlings-nummer"] ? " · " + esc(rec["Samlings-nummer"]) : "");
  }

  // Renders a ranked "närmast lika" list into `container`.
  // Entries with identical COI are collapsed into one expandable group row.
  // opts: onRowClick(rec), onCompare(rec) [adds a Jämför button], exclude(rec).
  function makeSimilarList(container, refRec, opts) {
    opts = opts || {};
    var similar = similarTo(refRec);
    if (opts.exclude) similar = similar.filter(function (s) { return s.rec !== opts.exclude; });

    // Group individuals with identical COI, ignoring N (ambiguous) bases:
    // members have 0 real differences from the group's representative, so two
    // sequences that differ only where one has an N still count as the same.
    var groups = [];
    similar.forEach(function (s) {
      var seq = s.rec["COI"] || "";
      var g = null;
      for (var i = 0; i < groups.length; i++) {
        if (coiIdentity(seq, groups[i].rep).diffs === 0) { g = groups[i]; break; }
      }
      if (!g) { g = { pct: s.id, rep: seq, members: [] }; groups.push(g); }
      g.members.push(s);
    });

    var shown = SIMILAR_STEP;

    function render() {
      var refs = []; // data-ref index → record
      function refRow(s, cls) {
        var n = refs.push(s.rec) - 1;
        return '<li class="' + (cls || "") + '" data-ref="' + n + '">' +
          '<span class="li-main">' +
            '<span class="sci">' + esc(s.rec["Vetenskapligt namn"] || "—") + '</span>' +
            '<span class="common">' + metaLine(s.rec) + "</span>" +
          "</span>" +
          pctHtml(s) +
          (opts.onCompare ? '<button class="cmp-btn" data-cmp="' + n + '">Jämför</button>' : "") +
        "</li>";
      }

      var items = groups.slice(0, shown).map(function (g, gi) {
        if (g.members.length === 1) return refRow(g.members[0]);
        // Collapsed group of individuals with identical COI. The header row
        // represents the first member (click navigates / Jämför compares it);
        // an expand toggle reveals the rest.
        var first = g.members[0];
        var firstN = refs.push(first.rec) - 1;
        var sci = {};
        g.members.forEach(function (m) { sci[m.rec["Vetenskapligt namn"] || "—"] = 1; });
        var names = Object.keys(sci);
        var sciLabel = names.length === 1 ? names[0] : names.length + " arter";
        var memberRows = g.members.map(function (m) { return refRow(m, "member"); }).join("");
        return '<li class="sim-group">' +
          '<div class="grouphead" data-ref="' + firstN + '">' +
            '<span class="li-main">' +
              '<span class="sci">' + esc(sciLabel) + "</span>" +
              '<span class="common">' + g.members.length + " individer · identisk COI · " +
                '<a class="expand-link" href="#" data-exp="' + gi + '">visa alla</a></span>' +
            "</span>" +
            '<span class="pct">' + g.pct.pct.toFixed(1) + " %<small>" + diffLabel(g.pct.diffs) + "</small></span>" +
            (opts.onCompare ? '<button class="cmp-btn" data-cmp="' + firstN + '">Jämför</button>' : "") +
          "</div>" +
          '<ul class="similar nested" data-members="' + gi + '" hidden>' + memberRows + "</ul>" +
        "</li>";
      }).join("");

      var remaining = groups.length - shown;
      var more = remaining > 0
        ? '<button class="show-more" data-more="1">Visa fler (' +
            Math.min(SIMILAR_STEP, remaining) + " av " + remaining + " kvar)</button>"
        : "";

      container.innerHTML = '<ul class="similar">' + items + "</ul>" + more;

      if (opts.onRowClick) {
        Array.prototype.forEach.call(container.querySelectorAll("[data-ref]"), function (el) {
          el.addEventListener("click", function () { opts.onRowClick(refs[+el.getAttribute("data-ref")]); });
        });
      }
      Array.prototype.forEach.call(container.querySelectorAll("button[data-cmp]"), function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          opts.onCompare(refs[+btn.getAttribute("data-cmp")]);
        });
      });
      Array.prototype.forEach.call(container.querySelectorAll("[data-exp]"), function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var ul = container.querySelector('ul[data-members="' + link.getAttribute("data-exp") + '"]');
          if (!ul) return;
          var wasHidden = ul.hasAttribute("hidden");
          if (wasHidden) ul.removeAttribute("hidden"); else ul.setAttribute("hidden", "");
          link.textContent = wasHidden ? "dölj" : "visa alla";
        });
      });
      var moreBtn = container.querySelector("button[data-more]");
      if (moreBtn) moreBtn.addEventListener("click", function () { shown += SIMILAR_STEP; render(); });
    }

    render();
  }

  // Pairwise alignment view: 60 bp per row, match track (| / .), mismatches boxed.
  function alignHtml(a, b) {
    var W = 60;
    var len = Math.max(a.length, b.length);
    var g = String(len).length;
    function pad(n) { return String(n).padStart(g, " "); }
    var blank = " ".repeat(g);
    var blocks = [];
    for (var i = 0; i < len; i += W) {
      var end = Math.min(i + W, len);
      var aB = "", bB = "", tB = "";
      for (var j = i; j < end; j++) {
        var ra = a[j], rb = b[j];
        // Show N (or a missing base) as a gap dash; these positions are
        // ambiguous and are NOT counted as differences in the % identity.
        var gapA = !ra || ra === "N", gapB = !rb || rb === "N";
        var da = gapA ? "-" : ra, db = gapB ? "-" : rb;
        if (gapA || gapB) {
          aB += '<span class="gp">' + da + "</span>";
          bB += '<span class="gp">' + db + "</span>";
          tB += "~";
        } else if (ra === rb) {
          aB += da; bB += db; tB += "|";
        } else {
          aB += '<span class="mm">' + da + "</span>";
          bB += '<span class="mm">' + db + "</span>";
          tB += ".";
        }
        // Group in tens for readability (display only), no trailing group gap.
        if ((j + 1) % 10 === 0 && j + 1 !== end) { aB += " "; bB += " "; tB += " "; }
      }
      blocks.push(
        '<span class="ln">' + pad(i + 1) + "  <span class=\"sb\">" + aB + "</span>  " + pad(end) + "</span>\n" +
        '<span class="ln">' + blank + "  <span class=\"tb\">" + tB + "</span></span>\n" +
        '<span class="ln">' + pad(i + 1) + "  <span class=\"sb\">" + bB + "</span>  " + pad(end) + "</span>"
      );
    }
    return blocks.join("\n\n");
  }

  // Side-by-side comparison of two individuals.
  // Wire a "copy COI" button that copies the raw sequence (no display spaces).
  function wireCopy(btn, seq, label) {
    if (!btn) return;
    label = label || "Kopiera sekvens";
    btn.addEventListener("click", function () {
      var done = function () {
        btn.textContent = "Kopierat ✓";
        btn.classList.add("ok");
        setTimeout(function () {
          btn.textContent = label;
          btn.classList.remove("ok");
        }, 1500);
      };
      function fallbackCopy() {
        var ta = document.createElement("textarea");
        ta.value = seq;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(seq).then(done, fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  }

  function renderCompare(a, b) {
    var id = coiIdentity(a["COI"] || "", b["COI"] || "");
    view.innerHTML =
      '<button class="back" id="back">&larr; Tillbaka till listan</button>' +
      '<div class="card">' +
        "<h2>Jämförelse</h2>" +
        '<div class="cmp-summary">' +
          '<span class="pct">' + id.pct.toFixed(1) + " % likhet · " + id.diffs +
            " skillnader / " + id.compared + " bp" +
            (id.missing ? " · " + id.missing + " saknade" : "") + "</span>" +
        "</div>" +
        '<div class="legend">' +
          '<span class="sw sw-mm"></span> skillnad' +
          '<span class="sw sw-eq"></span> lika' +
          '<span class="sw sw-gp"></span> tvetydig (N, räknas ej)' +
        "</div>" +
        '<div class="align-wrap"><pre class="align">' + alignHtml(a["COI"] || "", b["COI"] || "") + "</pre></div>" +
        '<div class="compare-cols">' +
          '<div class="col">' +
            "<h3>" + esc(a["Vetenskapligt namn"] || "—") + "</h3>" +
            '<div class="subtitle">' + esc(a["Artnamn"] || "") + "</div>" +
            '<button class="open-detail" id="openA">Öppna detaljsida →</button>' +
            (a["COI"] ? '<button class="copy-btn" id="copyA">Kopiera COI</button>' : "") +
            fieldsHtml(a) +
            "<h4>Byt vänster – närmast lika</h4>" +
            '<div id="simA"></div>' +
          "</div>" +
          '<div class="col">' +
            "<h3>" + esc(b["Vetenskapligt namn"] || "—") + "</h3>" +
            '<div class="subtitle">' + esc(b["Artnamn"] || "") + "</div>" +
            '<button class="open-detail" id="openB">Öppna detaljsida →</button>' +
            (b["COI"] ? '<button class="copy-btn" id="copyB">Kopiera COI</button>' : "") +
            fieldsHtml(b) +
            "<h4>Byt höger – närmast lika</h4>" +
            '<div id="simB"></div>' +
          "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("back").addEventListener("click", goList);
    document.getElementById("openA").addEventListener("click", function () { goDetail(a); });
    document.getElementById("openB").addEventListener("click", function () { goDetail(b); });
    wireCopy(document.getElementById("copyA"), a["COI"] || "", "Kopiera COI");
    wireCopy(document.getElementById("copyB"), b["COI"] || "", "Kopiera COI");

    makeSimilarList(document.getElementById("simA"), a, {
      exclude: b,
      onRowClick: function (o) { goCompare(o, b); }
    });
    makeSimilarList(document.getElementById("simB"), b, {
      exclude: a,
      onRowClick: function (o) { goCompare(a, o); }
    });

    window.scrollTo(0, 0);
  }

  function renderDetail(r) {
    var seq = r["COI"] || "";
    var rows = DETAIL_FIELDS.filter(function (f) {
      var v = r[f[0]];
      return v !== null && v !== undefined && v !== "";
    }).map(function (f) {
      return "<dt>" + esc(f[1]) + "</dt><dd>" + esc(r[f[0]]) + "</dd>";
    }).join("");

    var link = r["Länk"]
      ? '<dd class="link-row"><a href="' + esc(r["Länk"]) + '" target="_blank" rel="noopener">' + esc(r["Länk"]) + "</a></dd>"
      : "";

    var similar = similarTo(r);

    var nMissing = (seq.match(/N/g) || []).length;
    var seqBlock = seq
      ? '<div class="seq-header">' +
          "<h3>COI (" + seq.length + " bp" +
            (nMissing ? " · " + nMissing + " saknas" : "") + ")</h3>" +
          '<button class="copy-btn" id="copy">Kopiera sekvens</button>' +
        "</div>" +
        '<pre class="seq">' + formatSeq(seq) + "</pre>"
      : "";

    var sideCol = similar.length
      ? '<aside class="detail-side">' +
          '<div class="seq-header"><h3>Närmast lika (COI-likhet)</h3>' + variantTreeLink(r) + "</div>" +
          '<div id="similar-box"></div>' +
        "</aside>"
      : "";

    view.innerHTML =
      '<button class="back" id="back">&larr; Tillbaka till listan</button>' +
      '<div class="card">' +
        '<h2>' + esc(r["Vetenskapligt namn"] || "—") + "</h2>" +
        '<div class="subtitle">' + esc(r["Artnamn"] || "") +
          (r["Artnamn"] ? " · " : "") +
          '<a class="species-link" href="#/s/' + encodeURIComponent(speciesByName[r.__species].slug) + '">Visa art →</a>' +
          (r["COI"] ? ' · <a class="species-link" href="' + variantTreeHash(r) + '">Visa individträd →</a>' : "") + refLink(r) + "</div>" +
        '<div class="detail-grid">' +
          '<div class="detail-main">' +
            '<dl class="fields">' + rows + link + "</dl>" +
            seqBlock +
          "</div>" +
          sideCol +
        "</div>" +
      "</div>";

    document.getElementById("back").addEventListener("click", goList);

    var similarBox = document.getElementById("similar-box");
    if (similarBox) {
      makeSimilarList(similarBox, r, {
        onRowClick: function (o) { goDetail(o); },
        onCompare: function (o) { goCompare(r, o); }
      });
    }

    if (seq) wireCopy(document.getElementById("copy"), seq, "Kopiera sekvens");

    window.scrollTo(0, 0);
  }

  // Classical MDS (2 dimensions) of a symmetric distance matrix, by power
  // iteration with deflation. Deterministic, fine for a few dozen points.
  function mds2(D) {
    var n = D.length, i, j;
    if (n < 2) return [[0, 0]];
    var rm = [], tm = 0;
    for (i = 0; i < n; i++) {
      rm[i] = 0;
      for (j = 0; j < n; j++) rm[i] += D[i][j] * D[i][j];
      rm[i] /= n; tm += rm[i];
    }
    tm /= n;
    var B = [], shift = 0;
    for (i = 0; i < n; i++) {
      B[i] = []; var s = 0;
      for (j = 0; j < n; j++) {
        B[i][j] = -0.5 * (D[i][j] * D[i][j] - rm[i] - rm[j] + tm);
        s += Math.abs(B[i][j]);
      }
      if (s > shift) shift = s; // shift makes B + shift·I positive, so the top eigenvalue wins
    }
    function top() {
      var v = [], w, it, norm, lam = 0;
      for (i = 0; i < n; i++) v[i] = Math.sin(i * 1.7 + 1) + 1.3;
      for (it = 0; it < 400; it++) {
        w = []; norm = 0;
        for (i = 0; i < n; i++) {
          w[i] = shift * v[i];
          for (j = 0; j < n; j++) w[i] += B[i][j] * v[j];
          norm += w[i] * w[i];
        }
        norm = Math.sqrt(norm) || 1;
        for (i = 0; i < n; i++) v[i] = w[i] / norm;
      }
      for (i = 0; i < n; i++) for (j = 0; j < n; j++) lam += v[i] * B[i][j] * v[j];
      return { v: v, lam: lam };
    }
    var e1 = top();
    if (e1.lam > 1e-9) for (i = 0; i < n; i++) for (j = 0; j < n; j++) B[i][j] -= e1.lam * e1.v[i] * e1.v[j];
    var e2 = top();
    var s1 = e1.lam > 1e-9 ? Math.sqrt(e1.lam) : 0, s2 = e2.lam > 1e-9 ? Math.sqrt(e2.lam) : 0;
    return e1.v.map(function (x, k) { return [x * s1, e2.v[k] * s2]; });
  }

  // Stress-minimising MDS (SMACOF, Guttman transform) starting from `X`.
  // Classical MDS drops everything outside its two main axes, so a pair that
  // differs mostly "sideways" can be drawn almost on top of each other; this
  // instead spreads the error over all pairs.
  function smacof(D, X) {
    var n = D.length, i, j, it;
    if (n < 4) return X; // up to 3 points classical MDS is already exact
    for (it = 0; it < 300; it++) {
      var Y = [], moved = 0;
      for (i = 0; i < n; i++) {
        var a = 0, b = 0;
        for (j = 0; j < n; j++) {
          if (i === j) continue;
          var dx = X[i][0] - X[j][0], dy = X[i][1] - X[j][1], e = Math.sqrt(dx * dx + dy * dy);
          if (e > 1e-9) { a += D[i][j] / e * dx; b += D[i][j] / e * dy; }
        }
        Y.push([a / n, b / n]);
      }
      for (i = 0; i < n; i++) moved = Math.max(moved, Math.abs(Y[i][0] - X[i][0]), Math.abs(Y[i][1] - X[i][1]));
      X = Y;
      if (moved < 1e-4) break;
    }
    return X;
  }

  // One species: clickable individuals + a scatter plot of COI differences.
  // Each point is a unique COI variant (identical individuals share a point,
  // sized by count); distance between points ≈ number of differing bases.
  // `others` (0–2 species) are plotted alongside `sp`, each in its own color,
  // which turns the page into a comparison. State kept across re-renders of the same page.
  var MAX_GROUP_NAMES = 3; // species page: list at most this many provinces / localities per group, else a count
  var speciesShown = null, nearQuery = "", openGroups = {}; // openGroups: expanded identical-COI groups
  // Series colors in fixed order (blue, orange, aqua: the three slots that stay
  // distinguishable in a scatter plot). The main species is always the first.
  var SPECIES_COLORS = ["#2a78d6", "#eb6834", "#1baf7a"];
  var MAX_OTHERS = 2;

  // Unique COI variants of a species' individuals (identical ignoring N share one).
  function coiGroups(members, tag) {
    var groups = [];
    members.forEach(function (r) {
      if (!r["COI"]) return;
      var g = null;
      for (var i = 0; i < groups.length; i++) {
        if (coiIdentity(r["COI"], groups[i].members[0]["COI"]).diffs === 0) { g = groups[i]; break; }
      }
      if (!g) { g = { members: [], s: tag }; groups.push(g); }
      g.members.push(r);
    });
    return groups;
  }

  // Other species ranked by closeness to `sp`: highest COI identity (%) between
  // any individual of each (ties: highest mean). Cached per species.
  // `min` = differences (bp) of that closest pair.
  var nearCache = {};
  function nearestSpecies(sp) {
    if (nearCache[sp.slug]) return nearCache[sp.slug];
    var mine = sp.members.filter(function (r) { return r["COI"]; });
    var res = [];
    speciesList.forEach(function (o) {
      if (o === sp) return;
      var theirs = o.members.filter(function (r) { return r["COI"]; });
      if (!theirs.length || !mine.length) return;
      var best = null, sum = 0, cnt = 0;
      mine.forEach(function (a) {
        theirs.forEach(function (b) {
          var id = coiIdentity(a["COI"], b["COI"]);
          if (!best || id.pct > best.pct) best = id;
          sum += id.pct; cnt++;
        });
      });
      res.push({ sp: o, pct: best.pct, min: best.diffs, mean: sum / cnt, n: theirs.length });
    });
    res.sort(function (a, b) { return b.pct - a.pct || b.mean - a.mean; });
    return (nearCache[sp.slug] = res);
  }

  function renderSpecies(sp, others) {
    var samePage = speciesShown === sp.slug;
    if (!samePage) { nearQuery = ""; openGroups = {}; }
    speciesShown = sp.slug;
    // Sorted by Släkte/art (the merged taxon field), then collection number.
    var members = sp.members.slice().sort(function (a, b) {
      var ta = a.__taxon || "", tb = b.__taxon || "";
      if (ta !== tb) return ta < tb ? -1 : 1;
      var x = a["Samlings-nummer"] || "", y = b["Samlings-nummer"] || "";
      return x < y ? -1 : x > y ? 1 : 0;
    });
    var groups = coiGroups(members, 0), gOf = {};
    groups.forEach(function (g, gi) { g.members.forEach(function (r) { gOf[r.__slug] = gi; }); });
    var nNoCoi = members.length - Object.keys(gOf).length, nMain = groups.length;
    var hist = '<div class="seq-header"><h3>Fördelning av COI-varianter</h3></div>' +

    var plot = "";
    if (groups.length >= 1) { // also for a single variant, so the species always has a plot

        '<div class="chart-note">Varje punkt är en unik COI-variant; avståndet motsvarar ungefär antal ' +
        "skillnader (bp, N ignoreras) – hovra för exakta avstånd. Storleken visar antal individer med identisk COI." +

        (others.length
          ? '<div class="legend-sp">' + [sp].concat(others).map(function (s, k) {

        (nNoCoi ? '<div class="chart-note">' + nNoCoi + " individ(er) saknar COI och visas inte.</div>" : "") +
        (groups.length >= 3 // with two variants the midpoint-rooted tree is just two equal branches

            '<div class="chart-note">Neighbour joining på samma unika COI-varianter, rotat i mittpunkten. ' +
            "Grenlängd i bp (N ignoreras); (+n) = fler individer med identisk COI.</div>" +
            '<div class="tree" id="tree"></div>'
          : "") +
        // The page's own (blue) species, listed just above the plotted others' lines.
        (others.length
          ? '<div class="chart-note"><span class="sw-dot" style="background:' + SPECIES_COLORS[0] + '"></span>' +
            "<i>" + esc(sp.name) + "</i></div>"

    }

    // Nearest species (search box filters by name; click plots the species above).
    var near = sp.members.some(function (r) { return r["COI"]; })
      ? '<div class="seq-header"><h3>Närmaste arter</h3>' + treeLink(sp) + "</div>" +
        others.map(function (o, k) {

            "<i>" + esc(o.name) + "</i> · " +
            '<a href="#/s/' + encodeURIComponent(o.slug) + '">öppna artsida →</a> · ' +

      '<button class="back" id="back">&larr; Tillbaka till listan</button>' +
      '<div class="card">' +
        "<h2>" + esc(sp.name) + "</h2>" +
        '<div class="subtitle">' + esc(common) + (common ? " · " : "") + members.length +
          (members.length === 1 ? " individ" : " individer") +
          (hasSpeciesRef(sp) ? ' · <a class="species-link" href="' + speciesRefHash(sp) + '">Visa referensdata →</a>' : "") + "</div>" +
        '<div class="detail-grid">' +
          '<div class="detail-main">' + (nMain ? hist : "") + rows + speciesRefHtml(sp) + "</div>" +
          (plot || near ? '<aside class="detail-side">' + plot + near + "</aside>" : "") +
        "</div>" +
      "</div>";

    document.getElementById("back").addEventListener("click", goList);
    var main = view.querySelector(".detail-main");
    var items = Array.prototype.slice.call(main.querySelectorAll("[data-g]"));
    Array.prototype.forEach.call(main.querySelectorAll("[data-ref]"), function (el) {
      el.addEventListener("click", function (e) {

        goDetail(members[+el.getAttribute("data-ref")]);

    Array.prototype.forEach.call(main.querySelectorAll("[data-exp]"), function (link) {
      link.addEventListener("click", function (e) {

        openGroups[g] = ul.hasAttribute("hidden");
        if (openGroups[g]) ul.removeAttribute("hidden"); else ul.setAttribute("hidden", "");

    if (groups.length >= 1) {

      var hl = drawScatter(groups, items, allNames);

  function setupNearest(sp, others) {
    var q = document.getElementById("near-q"), box = document.getElementById("near-list");
    var all = nearestSpecies(sp), shown = SIMILAR_STEP;
    q.value = nearQuery;

    function draw() {
      var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      var list = all.filter(function (x) {
        var hay = x.sp.name.toLowerCase();
        return words.every(function (w) { return hay.indexOf(w) !== -1; });
      });
      if (!list.length) { box.innerHTML = '<p class="empty">Inga arter.</p>'; return; }
      var rows = list.slice(0, shown).map(function (x, i) {
        return '<li data-i="' + i + '"' + (others.indexOf(x.sp) !== -1 ? ' class="sel"' : "") + ">" +
          '<span class="li-main"><span class="sci">' + esc(x.sp.name) + "</span>" +
          '<span class="common">' + x.n + (x.n === 1 ? " individ" : " individer") + " med COI · " +
            '<a href="#/s/' + encodeURIComponent(x.sp.slug) + '" class="open-sp">öppna artsida →</a></span></span>' +
          '<span class="pct">' + x.pct.toFixed(1) + " %<small>" + diffLabel(x.min) +

        (rest > 0 ? '<button class="show-more" data-more="1">Visa fler (' +
          Math.min(SIMILAR_STEP, rest) + " av " + rest + " kvar)</button>" : "");
      // The link navigates by itself; keep it from also selecting the row.
      Array.prototype.forEach.call(box.querySelectorAll("a.open-sp"), function (a) {
        a.addEventListener("click", function (e) { e.stopPropagation(); });
      });
      Array.prototype.forEach.call(box.querySelectorAll("li"), function (li) {

            ? others.filter(function (o) { return o !== x.sp; })
            : others.concat(x.sp).slice(-MAX_OTHERS);

    }

  }

  // Largest pairwise COI difference (bp, N ignored) between two individuals
  // of the same species, over all species. Computed once, on first use.
  var maxDiffCache = null;
  function maxSpeciesDiff() {
    if (maxDiffCache !== null) return maxDiffCache;
    var mx = 0;
    speciesList.forEach(function (sp) {
      var withCoi = sp.members.filter(function (r) { return r["COI"]; });
      for (var i = 0; i < withCoi.length; i++) {
        for (var j = i + 1; j < withCoi.length; j++) {
          var d = coiIdentity(withCoi[i]["COI"], withCoi[j]["COI"]).diffs;
          if (d > mx) mx = d;
        }
      }
    });
    return (maxDiffCache = mx);
  }

  // Neighbour-joining tree (Saitou & Nei) from a symmetric distance matrix.
  // Returns undirected edges [a, b, length]; leaves are 0..n-1, inner nodes get
  // higher ids. Negative lengths (possible in NJ) are clamped to 0.
  function neighborJoin(D) {
    var n = D.length, i, j, k;
    var d = [], edges = [];
    for (i = 0; i < 2 * n; i++) { d[i] = []; for (j = 0; j < 2 * n; j++) d[i][j] = i < n && j < n ? D[i][j] : 0; }
    var active = [], next = n;
    for (i = 0; i < n; i++) active.push(i);
    while (active.length > 3) {
      var m = active.length, r = {}, best = null;
      active.forEach(function (a) {
        r[a] = 0;
        active.forEach(function (b) { r[a] += d[a][b]; });
      });
      for (i = 0; i < m; i++) for (j = i + 1; j < m; j++) {
        var a = active[i], b = active[j], q = (m - 2) * d[a][b] - r[a] - r[b];
        if (!best || q < best.q) best = { a: a, b: b, q: q };
      }
      var u = next++, da = d[best.a][best.b] / 2 + (r[best.a] - r[best.b]) / (2 * (m - 2));
      edges.push([best.a, u, da], [best.b, u, d[best.a][best.b] - da]);
      active = active.filter(function (x) { return x !== best.a && x !== best.b; });
      active.forEach(function (x) {
        d[u][x] = d[x][u] = (d[best.a][x] + d[best.b][x] - d[best.a][best.b]) / 2;
      });
      active.push(u);
    }
    if (active.length === 3) {
      var p = active[0], s = active[1], t = active[2], c = next++;
      var dp = (d[p][s] + d[p][t] - d[s][t]) / 2;
      edges.push([p, c, dp], [s, c, d[p][s] - dp], [t, c, d[p][t] - dp]);
    } else if (active.length === 2) {
      edges.push([active[0], active[1], d[active[0]][active[1]]]);
    }
    return edges.map(function (e) { return [e[0], e[1], Math.max(0, e[2])]; });
  }

  // Midpoint-root an undirected NJ tree (root sits halfway along the longest
  // leaf-to-leaf path) and return nested nodes { id, len, children }.
  function rootTree(edges, nLeaves) {
    var adj = {};
    function link(a, b, l) { (adj[a] = adj[a] || []).push({ to: b, len: l }); }
    edges.forEach(function (e) { link(e[0], e[1], e[2]); link(e[1], e[0], e[2]); });
    function walk(src) { // distances + parents from src
      var dist = {}, par = {}, stack = [src];
      dist[src] = 0; par[src] = null;
      while (stack.length) {
        var x = stack.pop();
        adj[x].forEach(function (nb) {
          if (!(nb.to in dist)) { dist[nb.to] = dist[x] + nb.len; par[nb.to] = x; stack.push(nb.to); }
        });
      }
      return { dist: dist, par: par };
    }
    var far = { a: 0, b: 0, L: -1 };
    for (var i = 0; i < nLeaves; i++) {
      var w = walk(i);
      for (var j = i + 1; j < nLeaves; j++) if (w.dist[j] > far.L) far = { a: i, b: j, L: w.dist[j] };
    }
    // Walk b → a until the edge that contains the midpoint, split it with the root.
    var wa = walk(far.a), node = far.b, half = far.L / 2, ROOT = "root";
    while (wa.par[node] !== null && wa.dist[wa.par[node]] > half) node = wa.par[node];
    var parent = wa.par[node], t = half - (parent === null ? 0 : wa.dist[parent]);
    if (parent === null) { parent = node; t = 0; } // single-node path (shouldn't happen)
    var len = wa.dist[node] - wa.dist[parent];
    adj[parent] = adj[parent].filter(function (nb) { return nb.to !== node; });
    adj[node] = adj[node].filter(function (nb) { return nb.to !== parent; });
    adj[ROOT] = [{ to: parent, len: t }, { to: node, len: Math.max(0, len - t) }];
    function build(id, from, l) {
      var kids = (adj[id] || []).filter(function (nb) { return nb.to !== from; });
      return { id: id, len: l, children: kids.map(function (nb) { return build(nb.to, id, nb.len); }) };
    }
    // Attach children of parent/node without walking back through the root.
    adj[parent].push({ to: ROOT, len: t });
    adj[node].push({ to: ROOT, len: Math.max(0, len - t) });
    return build(ROOT, null, 0);
  }

  // Rectangular tree of the plotted COI variants (leaves = groups). Leaf hover
  // highlights the matching point in the scatter plot via `hl(k, on)`.
  function drawTree(groups, names, hl) {
    var n = groups.length, D = [], i, j;
    for (i = 0; i < n; i++) {
      D[i] = [];
      for (j = 0; j < n; j++) {
        D[i][j] = i === j ? 0 : coiIdentity(groups[i].members[0]["COI"], groups[j].members[0]["COI"]).diffs;
      }
    }
    var root = rootTree(neighborJoin(D), n);

    var ROW = 18, TOP = 10, W = 520, LEFT = 10, LABEL = 118;
    var row = 0, maxDepth = 0;
    (function layout(nd, depth) {
      nd.x = depth; if (depth > maxDepth) maxDepth = depth;
      if (!nd.children.length) { nd.y = row++; return; }
      nd.children.forEach(function (c) { layout(c, depth + c.len); });
      nd.y = (nd.children[0].y + nd.children[nd.children.length - 1].y) / 2;
    })(root, 0);
    var H = TOP * 2 + row * ROW + 24;
    var sc = (W - LEFT - LABEL - 8) / Math.max(maxDepth, 1);
    function X(v) { return (LEFT + v * sc).toFixed(1); }
    function Y(v) { return (TOP + v * ROW + ROW / 2).toFixed(1); }

    var lines = "", leaves = "";
    (function draw(nd, parentX) {
      if (parentX !== null) lines += '<line class="br" x1="' + X(parentX) + '" x2="' + X(nd.x) + '" y1="' + Y(nd.y) + '" y2="' + Y(nd.y) + '"/>';
      if (nd.children.length) {
        lines += '<line class="br" x1="' + X(nd.x) + '" x2="' + X(nd.x) + '" y1="' + Y(nd.children[0].y) + '" y2="' + Y(nd.children[nd.children.length - 1].y) + '"/>';
        nd.children.forEach(function (c) { draw(c, nd.x); });
      } else {
        var g = groups[nd.id], first = g.members[0];
        var label = (first["Samlings-nummer"] || first["ID"] || "—") + (g.members.length > 1 ? " (+" + (g.members.length - 1) + ")" : "");
        var tip = (names.length > 1 ? names[g.s] + ": " : "") + g.members.map(function (r) { return r["Samlings-nummer"] || r["ID"]; }).join(", ");
        leaves += '<g class="leaf" data-k="' + nd.id + '"><title>' + esc(tip) + "</title>" +
          '<circle cx="' + X(nd.x) + '" cy="' + Y(nd.y) + '" r="4.5" style="fill:' + SPECIES_COLORS[g.s] + '"/>' +
          '<text x="' + (+X(nd.x) + 9) + '" y="' + Y(nd.y) + '" dy="0.35em">' + esc(label) + "</text></g>";
      }
    })(root, null);

    // Scale bar for branch lengths (bp).
    var nice = 1;
    [1, 2, 5, 10, 20, 50, 100].forEach(function (c) { if (c * sc <= W * 0.25) nice = c; });
    var by = H - 12;
    var bar = '<line class="sbar" x1="' + LEFT + '" x2="' + (LEFT + nice * sc).toFixed(1) + '" y1="' + by + '" y2="' + by + '"/>' +
      '<text class="sbar-t" x="' + (LEFT + nice * sc + 6).toFixed(1) + '" y="' + by + '" dy="0.35em">' + nice + " bp</text>";

    var el = document.getElementById("tree");
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Neighbour joining-träd över ' +
      n + ' unika COI-varianter">' + lines + leaves + bar + "</svg>";
    Array.prototype.forEach.call(el.querySelectorAll("g.leaf"), function (g) {
      var k = +g.getAttribute("data-k");
      g.addEventListener("mouseenter", function () { hl(k, true); });
      g.addEventListener("mouseleave", function () { hl(k, false); });
      g.addEventListener("click", function () { goDetail(groups[k].members[0]); });
    });
  }

  // Tooltip for a chart mark. Mouse: hover shows `tip` beside the pointer, click
  // opens. Touch (no hover): first tap shows it, a second tap on the same mark
  // opens, a tap anywhere else closes. show(touch) fills tip.innerHTML.
  var touchTip = null; // { el, close } of the tooltip opened by a tap
  document.addEventListener("click", function () { if (touchTip) touchTip.close(); });
  function touchHint(touch) {
    return touch ? '<div class="tip-hint">Tryck igen för att öppna</div>' : "";
  }
  function chartTip(el, wrap, tip, show, hide, open) {
    var byTouch = false;
    function place(cx, cy) {
      var b = wrap.getBoundingClientRect();
      var x = cx - b.left + 14, y = cy - b.top + 14;
      if (x + tip.offsetWidth > b.width) x = cx - b.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, x) + "px"; tip.style.top = y + "px";
    }
    function close() { hide(); tip.hidden = true; if (touchTip && touchTip.el === el) touchTip = null; }
    el.addEventListener("pointerenter", function (e) {
      if (e.pointerType !== "mouse") return;
      show(false); tip.hidden = false; place(e.clientX, e.clientY);
    });
    el.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") place(e.clientX, e.clientY); });
    el.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") close(); });
    el.addEventListener("pointerdown", function (e) { byTouch = e.pointerType !== "mouse"; });
    el.addEventListener("click", function (e) {
      if (!byTouch || (touchTip && touchTip.el === el)) { if (touchTip) touchTip.close(); open(); return; }
      e.stopPropagation();
      if (touchTip) touchTip.close();
      touchTip = { el: el, close: close };
      show(true); tip.hidden = false;
      var r = el.getBoundingClientRect();
      place(r.left + r.width / 2, r.top + r.height / 2);
    });
  }

  // Bar chart of one species' COI variants: bar height = individuals, bars in
  // tree leaf order, spaced so the gap between neighbours = their % difference.
  function drawHist(groups, hl) {
    var n = groups.length, i, j, D = [], order = [];
    function pctDiff(a, b) { return 100 - coiIdentity(a.members[0]["COI"], b.members[0]["COI"]).pct; }
    if (n >= 3) {
      for (i = 0; i < n; i++) { D[i] = []; for (j = 0; j < n; j++) D[i][j] = i === j ? 0 : pctDiff(groups[i], groups[j]); }
      (function leaves(nd) {
        if (!nd.children.length) order.push(nd.id); else nd.children.forEach(leaves);
      })(rootTree(neighborJoin(D), n));
    } else {
      for (i = 0; i < n; i++) order.push(i);
    }
    var pos = [0], gaps = [];
    for (i = 1; i < n; i++) {
      gaps.push(pctDiff(groups[order[i - 1]], groups[order[i]]));
      pos.push(pos[i - 1] + gaps[i - 1]);
    }
    var span = pos[n - 1], minGap = n > 1 ? Math.min.apply(null, gaps) : 0;

    var W = 420, H = 170, L = 30, R = 10, T = 18, B = 34, PW = W - L - R, PH = H - T - B;
    var bw = 22, sc = 0;

    var step = 1;
    [1, 2, 5, 10, 20, 50, 100].forEach(function (c) { if (maxC / c >= 2) step = c; });
    var top = Math.ceil(maxC / step) * step;
    function y(v) { return T + PH - v / top * PH; }

    var grid = "";
    for (var v = 0; v <= top; v += step) {
      grid += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>' +
        '<text class="ax" x="' + (L - 6) + '" y="' + y(v).toFixed(1) + '" dy="0.35em">' + v + "</text>";

      var hr0 = idx < n - 1 ? Math.min(22, (cx(idx + 1) - cx(idx)) / 2) : 22;
      var d = "M" + x0.toFixed(1) + "," + yb + "V" + (y0 + r).toFixed(1) +
        "Q" + x0.toFixed(1) + "," + y0.toFixed(1) + " " + (x0 + r).toFixed(1) + "," + y0.toFixed(1) +
        "H" + (x0 + bw - r).toFixed(1) +
        "Q" + (x0 + bw).toFixed(1) + "," + y0.toFixed(1) + " " + (x0 + bw).toFixed(1) + "," + (y0 + r).toFixed(1) +
        "V" + yb + "Z";

        '<rect class="hit" x="' + (cx(idx) - hl0).toFixed(1) + '" y="' + T + '" width="' + (hl0 + hr0).toFixed(1) + '" height="' + PH + '"/>' +
        '<path class="bar" d="' + d + '"/>' +
        (Math.min(hl0, hr0) >= 7 ? '<text class="cnt" x="' + cx(idx).toFixed(1) + '" y="' + (y0 - 5).toFixed(1) + '">' + c + "</text>" : "") +

        ? '<line class="gap" x1="' + (a + 1).toFixed(1) + '" x2="' + (b - 1).toFixed(1) + '" y1="' + (H - 22) + '" y2="' + (H - 22) + '"/>' +
          '<text class="ax gap-t" x="' + ((a + b) / 2).toFixed(1) + '" y="' + (H - 8) + '">' + fmt(g) + "</text>"
        : "";
    }).join("");

    var el = document.getElementById("hist");
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Stapeldiagram över ' + n +
      ' unika COI-varianter">' + grid + gapLbl + bars +
      '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/></svg>';

    var tip = document.getElementById("hist-tip"), wrap = el.parentNode;
    Array.prototype.forEach.call(el.querySelectorAll("g.hbar"), function (g) {
      var k = +g.getAttribute("data-k"), idx = +g.getAttribute("data-i"), ms = groups[k].members;
      chartTip(g, wrap, tip, function (touch) {
        g.classList.add("hl"); hl(k, true);
        tip.innerHTML = "<strong>" + ms.length + (ms.length === 1 ? " individ" : " individer") + "</strong>" +
          ms.slice(0, 8).map(function (r) {
            return "<div>" + esc([r["Samlings-nummer"] || r["ID"], r["Provins"]].filter(Boolean).join(" · ")) + "</div>";
          }).join("") + (ms.length > 8 ? "<div>+" + (ms.length - 8) + " till</div>" : "") +
          (idx > 0 ? "<div>← " + fmt(gaps[idx - 1]) + " till vänster granne</div>" : "") +
          (idx < n - 1 ? "<div>→ " + fmt(gaps[idx]) + " till höger granne</div>" : "") + touchHint(touch);
      }, function () { g.classList.remove("hl"); hl(k, false); }, function () { goDetail(ms[0]); });
    });
  }

  // `names` = [main species, ...compared species]; group.s says which a point is.
  function drawScatter(groups, items, names) {
    var n = groups.length, D = [], ID = [], i, j;
    for (i = 0; i < n; i++) {
      D[i] = []; ID[i] = [];
      for (j = 0; j < n; j++) {
        ID[i][j] = i === j ? null : coiIdentity(groups[i].members[0]["COI"], groups[j].members[0]["COI"]);
        D[i][j] = i === j ? 0 : ID[i][j].diffs;
      }
    }
    var pts = smacof(D, mds2(D));
    var W = 520, P = 20;
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs);
    var miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    var sx = maxx - minx, sy = maxy - miny;
    // Fixed scale, same on both axes and on every species page: the largest

    // (When two species are compared, the scale grows to fit the largest distance shown.)
    // That distance spans the full width; the height only fits the points' actual spread.

    for (i = 0; i < n; i++) for (j = 0; j < n; j++) if (D[i][j] > maxD) maxD = D[i][j];
    var scale = (W - 2 * P) / maxD;
    var H = Math.max(160, Math.ceil(sy * scale) + 2 * P + 14);
    var ox = (W - sx * scale) / 2 - minx * scale, oy = (H - 14 - sy * scale) / 2 - miny * scale;

    [1, 2, 5, 10, 20, 50, 100].forEach(function (c) { if (c * scale <= W * 0.3) nice = c; });

    var order = groups.map(function (_, k) { return k; }).sort(function (a, b) {
      return groups[b].members.length - groups[a].members.length; // big first, small on top
    });
    var marks = order.map(function (k) {
      var c = groups[k].members.length, r = 5 + 2.2 * Math.sqrt(c - 1);
      var cx = (pts[k][0] * scale + ox).toFixed(1), cy = (pts[k][1] * scale + oy).toFixed(1);
      return '<circle class="pt" style="fill:' + SPECIES_COLORS[groups[k].s] + '" data-k="' + k + '" cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(1) + '"/>' +
        (c > 1 ? '<text class="pt-n" x="' + cx + '" y="' + cy + '" dy="0.35em">' + c + "</text>" : "");
    }).join("");
    var barLen = Math.min(nice * scale, W - 2 * P - 40);
    var bar = barLen > 0
      ? '<line class="sbar" x1="' + P + '" x2="' + (P + barLen).toFixed(1) + '" y1="' + (H - 12) + '" y2="' + (H - 12) + '"/>' +
        '<text class="sbar-t" x="' + (P + barLen + 6).toFixed(1) + '" y="' + (H - 12) + '" dy="0.35em">' + nice + " bp</text>"
      : "";

    var plotEl = document.getElementById("plot");
    plotEl.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Scatter-plott av COI-skillnader mellan ' +
      n + ' unika varianter">' + marks + bar + "</svg>";

    var tip = document.getElementById("tip"), wrap = plotEl.parentNode;
    function rowsOf(k) { return items.filter(function (li) { return li.getAttribute("data-g") === String(k); }); }
    function setHl(k, on) {
      rowsOf(k).forEach(function (li) { li.classList.toggle("hl", on); });
      var c = plotEl.querySelector('circle[data-k="' + k + '"]');
      if (c) c.classList.toggle("hl", on);
      var hb = document.querySelector('#hist g.hbar[data-k="' + k + '"]');
      if (hb) hb.classList.toggle("hl", on);
    }
    Array.prototype.forEach.call(plotEl.querySelectorAll("circle.pt"), function (c) {
      var k = +c.getAttribute("data-k"), ms = groups[k].members;
      function label(r) { return esc([r["Samlings-nummer"], r["Provins"]].filter(Boolean).join(" · ")); }

      for (var j2 = 0; j2 < n; j2++) {

          "<strong>" + ms.length + (ms.length === 1 ? " individ" : " individer") + "</strong>" +
          ms.slice(0, 8).map(function (r) { return "<div>" + label(r) + "</div>"; }).join("") +
          (ms.length > 8 ? "<div>+" + (ms.length - 8) + " till</div>" : "") +
          (nearHtml ? '<div class="tip-near">' + nearHtml + "</div>" : "") + touchHint(touch);

  // --- Species tree page (#/t/<art>) ---

  var TREE_COUNTS = [5, 10, 15, 20, 30], TREE_DEFAULT = 10;

  function treeLink(sp) {

  function speciesDist(a, b) { // % difference of the closest pair of individuals

    var best = 0;
    a.members.forEach(function (x) {
      if (!x["COI"]) return;
      b.members.forEach(function (y) {

  function shortName(name) { return name.replace(/^(\S)\S*\s+/, "$1. "); }
  function fmtPct(v) { return (v < 10 ? v.toFixed(1) : v.toFixed(0)) + " %"; }

  function renderSpeciesTree(base, count) {
    var near = nearestSpecies(base).slice(0, count);
    var taxa = [base].concat(near.map(function (x) { return x.sp; }));
    var common = commonName(base);
    var counts = '<div class="sort-bar"><span class="lbl">Antal arter:</span>' + TREE_COUNTS.map(function (c) {
      return '<a class="sort-btn' + (c === count ? " on" : "") + '" href="' + treeHash(base, c) + '">' + c + "</a>";
    }).join("") + "</div>";
    var rows = near.map(function (x, k) {
      return '<li data-k="' + (k + 1) + '">' +
        '<span class="li-main"><span class="sci">' + esc(x.sp.name) + "</span>" +
          '<span class="common">' + esc(commonName(x.sp)) + "</span></span>" +
        '<span class="li-meta"><strong>' + fmtPct(100 - x.pct) + "</strong> · " + diffLabel(x.min) +
          '<a href="#/s/' + encodeURIComponent(x.sp.slug) + '">artsida →</a></span>' +
      "</li>";
    }).join("");

    view.innerHTML =
      '<a class="back" href="#/s/' + encodeURIComponent(base.slug) + '">&larr; Till artsidan</a>' +
      '<div class="card">' +
        "<h2>Artträd: <i>" + esc(base.name) + "</i></h2>" +
        '<div class="subtitle">' + esc(common) + (common ? " · " : "") + near.length + " närmaste arter</div>" +
        (near.length
          ? counts +
            '<div class="chart-note">Neighbour joining på arternas COI-skillnad (%, närmaste paret individer, N ignoreras), ' +
            "rotat i <i>" + esc(base.name) + "</i>. Procent efter namnet = skillnad mot basarten. " +
            "Klicka på en art för att utgå från den.</div>" +
            '<div class="tree sptree" id="sptree"></div>' +
            '<div class="seq-header"><h3>Arter i trädet</h3></div>' +

    Array.prototype.forEach.call(view.querySelectorAll(".sptree-rows li"), function (li) {
      li.addEventListener("click", function (e) {
        if (e.target.closest("a")) return; // "artsida →" link
        setHash(treeHash(taxa[+li.getAttribute("data-k")], count).slice(1));
      });
    });
    window.scrollTo(0, 0);
  }

  function drawSpeciesTree(taxa, near, count) {
    var n = taxa.length, D = [], i, j;
    for (i = 0; i < n; i++) {
      D[i] = [];
      for (j = 0; j < n; j++) D[i][j] = i === j ? 0 : speciesDist(taxa[i], taxa[j]);
    }
    drawRootedTree("sptree", D, taxa.map(function (t, k) {
      return {
        name: shortName(t.name),
        dist: k ? fmtPct(100 - near[k - 1].pct) : "",
        title: t.name + (k ? " – klicka för att utgå från denna art" : ""),
        color: SPECIES_COLORS[1]

    }), "Artträd från " + taxa[0].name, function (k) {

    });
  }

  // Rectangular tree rooted in leaf 0 (drawn as the root on the left, other
  // leaves branching out to the right). D = pairwise distances in %.
  // nodes[k] = { pre, name, dist, title, color }; onPick(k) on leaf click.
  function drawRootedTree(elId, D, nodes, aria, onPick) {
    var root = rootAtLeaf(neighborJoin(D), 0);
    var ROW = 22, TOP = 10, W = 640, PAD = 4, GAP = 11; // GAP: dot → label
    var row = 0, maxDepth = 0;
    (function layout(nd, depth) {
      nd.x = depth; if (depth > maxDepth) maxDepth = depth;
      if (!nd.children.length) { nd.y = row++; return; }
      nd.children.forEach(function (c) { layout(c, depth + c.len); });
      nd.y = (nd.children[0].y + nd.children[nd.children.length - 1].y) / 2;
    })(root, 0);
    var H = TOP + row * ROW + 30;
    function Y(v) { return (TOP + v * ROW + ROW / 2).toFixed(1); }
    function label(o) {
      return (o.pre ? esc(o.pre) + " " : "") + '<tspan font-style="italic">' + esc(o.name) + "</tspan>" +
        (o.dist ? ' <tspan class="d">' + esc(o.dist) + "</tspan>" : "");
    }

    // leaves, so the margins are the label widths: estimated first, then
    // measured from the rendered text and redrawn to drop unused space.
    // The base's own branch (root → first split) only says how far the base is

      }

      if (stem) {
        var mx = left + STEM / 2, my = +Y(root.y);

          '<line class="brk" x1="' + (mx + 1) + '" x2="' + (mx + 5) + '" y1="' + (my + 5) + '" y2="' + (my - 5) + '"/>' +
          '<text class="sbar-t" x="' + mx + '" y="' + (my - 8) + '" text-anchor="middle">' + fmtPct(stem) + "</text>";
      }
      (function draw(nd, parentX) {
        if (parentX !== null) lines += '<line class="br" x1="' + X(parentX) + '" x2="' + X(nd.x) + '" y1="' + Y(nd.y) + '" y2="' + Y(nd.y) + '"/>';
        if (nd.children.length > 1) {
          lines += '<line class="br" x1="' + X(nd.x) + '" x2="' + X(nd.x) + '" y1="' + Y(nd.children[0].y) + '" y2="' + Y(nd.children[nd.children.length - 1].y) + '"/>';
        }
        nd.children.forEach(function (c) { draw(c, nd.x); });
        if (nd === root) {
          leaves += '<g class="base"><title>' + esc(nodes[0].title) + "</title>" +
            '<circle cx="' + X(nd.x) + '" cy="' + Y(nd.y) + '" r="6"/>' +
            '<text x="' + (+X(nd.x) - GAP) + '" y="' + Y(nd.y) + '" dy="0.35em" text-anchor="end">' + label(nodes[0]) + "</text></g>";
        } else if (!nd.children.length) {
          var o = nodes[nd.id];
          leaves += '<g class="leaf" data-k="' + nd.id + '"><title>' + esc(o.title) + "</title>" +
            '<circle cx="' + X(nd.x) + '" cy="' + Y(nd.y) + '" r="4.5" style="fill:' + o.color + '"/>' +
            '<text x="' + (+X(nd.x) + GAP - 2) + '" y="' + Y(nd.y) + '" dy="0.35em">' + label(o) + "</text></g>";

      // Scale bar for branch lengths (%).

      var by = H - 12;
      var bar = '<line class="sbar" x1="' + left + '" x2="' + (left + nice * sc).toFixed(1) + '" y1="' + by + '" y2="' + by + '"/>' +
        '<text class="sbar-t" x="' + (left + nice * sc + 6).toFixed(1) + '" y="' + by + '" dy="0.35em">' + nice + " %</text>";
      return { treeRight: +X(maxDepth), html: '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(aria) + '">' +

    }

    var baseText = (nodes[0].pre ? nodes[0].pre + " " : "") + nodes[0].name;
    var left = PAD + baseText.length * 7 + GAP, right = 230;
    var el = document.getElementById(elId), out = svg(left, right);
    el.innerHTML = out.html;
    var baseEl = el.querySelector(".base text");
    if (baseEl && baseEl.getComputedTextLength) {

      var over = 0;
      Array.prototype.forEach.call(el.querySelectorAll(".leaf text"), function (t) {
        var end = +t.getAttribute("x") + t.getComputedTextLength();

      });
      left = PAD + baseEl.getComputedTextLength() + GAP;
      el.innerHTML = svg(left, over + PAD).html;
    }
    Array.prototype.forEach.call(el.querySelectorAll("g.leaf"), function (g) {
      g.addEventListener("click", function () { onPick(+g.getAttribute("data-k")); });
    });
  }

  // --- Individual tree page (#/v/<individ>) ---
  // Like the species tree, but per unique COI variant across all species

  var VTREE_COUNTS = [10, 20, 30, 50], VTREE_DEFAULT = 20;
  var VTREE_THRESHOLDS = [0, 1, 2, 3, 4, 5], VTREE_T_DEFAULT = 2;
  var MIXED_COLOR = "#8a95a5"; // cluster spanning several species

  var variantCache = null; // { groups, of: slug → group index, M: pairwise coiIdentity }
  function allVariants() {
    if (variantCache) return variantCache;
    var groups = coiGroups(records, 0), of = {}, M = [], i, j;

    for (i = 0; i < groups.length; i++) M[i] = [];

  // Single-linkage clusters of the exact variants: two variants share a cluster

    for (i = 0; i < n; i++) par[i] = i;
    function find(x) { while (par[x] !== x) x = par[x] = par[par[x]]; return x; }
